repos:
  - repo: local
    hooks:
      # --- pre-commit: fast static checks (seconds) ---
      - id: ruff
        name: ruff lint
        entry: ruff check --fix
        language: system
        types: [python]
        exclude: '^\.vulture_whitelist\.py$'
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        stages: [pre-commit]
      # --- pre-push: heavier checks ---
      # Dead code at confidence 60, not 80. At 80 vulture reports only unused
      # variables; the 247 unused methods and 95 unused classes found in
      # AI_SLOP_AUDIT.md all sit in the 60-79 band. Ratcheted against
      # .quality/vulture-baseline.txt, which should only ever get shorter.
      - id: vulture
        name: dead code detection (vulture, ratcheted)
        entry: python scripts/quality/vulture_gate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Cross-file structural duplication. jscpd finds 0.58% here because the
      # duplication is copy-paste-then-rename; an AST-normalised pass is the
      # only thing that sees it. Fails on clone clusters absent from baseline.
      - id: structural-clones
        name: cross-file structural duplication
        entry: python scripts/quality/structural_clones.py src/oida --baseline .quality/clones.json --fail-on-new
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # Tests that pass without asserting anything. A green suite is not
      # assurance if 181 tests have no assertion and 23 are skip stubs.
      - id: test-quality
        name: low-assurance test detection
        entry: python scripts/quality/test_quality.py tests/ --baseline .quality/tests.json
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: mypy
        name: type check (mypy, informational)
        entry: .githooks/mypy-check
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # --- data-leak guards (pre-commit) ---
      - id: block-scan-artifacts
        name: block scan/fuzz/PHI artifacts
        language: fail
        entry: >-
          staged file is a scan output, fuzz artifact, or PHI carrier —
          remove it from the index or add an exemption to .gitignore
        files: >-
          (?x)(
            \.db$
            | \.db-wal$
            | \.db-shm$
            | \.dcm$
            | (^|/)dicom_output/
            | (^|/)findings/
            | (^|/)boofuzz-results/
            | (^|/)P-[^/]*\.zip$
          )
        stages: [pre-commit]
      - id: block-env-files
        name: block credential / env files
        language: fail
        entry: >-
          staged file looks like a credential or environment config —
          secrets must never be committed
        files: '(^|/)\.env$|(^|/)\.env\.[^/]+$'
        stages: [pre-commit]
      - id: check-dicom-magic
        name: block DICOM magic bytes (PHI guard)
        entry: .githooks/check-dicom-magic
        language: script
        types: [file]
        exclude: '\.(py|md|txt|yml|yaml|toml|json|lock|cfg|ini|rst|js|ts|css|html)$'
        stages: [pre-commit]
      - id: check-secrets
        name: block probable secrets
        entry: .githooks/check-secrets
        language: script
        types_or: [python, text]
        stages: [pre-commit]
      # --- commit-msg ---
      - id: no-ai-coauthor
        name: block AI co-author lines
        entry: .githooks/no-ai-coauthor
        language: script
        always_run: true
        stages: [commit-msg]
