# ============================================================================
# Release Pipeline - oida
# ============================================================================
#
# Security hardening applied:
#   - Top-level permissions: {} (deny all by default)
#   - All actions pinned to full commit SHA (prevents tag-force-push attacks)
#   - OIDC trusted publishing for PyPI (no long-lived API tokens)
#   - Build and publish are separate jobs (build has no secret access)
#   - Publish job uses 'pypi' environment with approval protection
#   - Artifact attestation for supply chain integrity (SLSA, when public)
#   - Checksum verification between build and publish jobs
#   - No pip install in publish job (avoids arbitrary code execution)
#   - persist-credentials: false on all checkouts
#
# This builds the pure-Python sdist + wheel from the project root (src/ layout).
# The standalone binaries are built separately by build-binaries.yml.
#
# Required GitHub configuration (one-time, in the web UI - no tokens):
#   1. Create a 'pypi' environment with required reviewers
#      (Settings -> Environments -> New environment -> pypi -> add reviewers).
#      This is what blocks auto-publish: dispatching the workflow pauses the
#      publish job for manual approval.
#   2. Configure the PyPI trusted publisher for project `oida-ics`
#      (the PyPI distribution name - the GitHub repo is `oida`):
#        - Owner:       f0rw4rd
#        - Repository:  oida
#        - Workflow:    release.yml
#        - Environment: pypi
#      (PyPI -> your project / "pending publisher" -> Add a new publisher.)
#   3. No API token needed - OIDC trusted publishing only.
#
# To cut a release: bump __version__ in src/oida/__init__.py, commit, then
#   git tag v1.0.0 && git push origin v1.0.0
# then run by hand: gh workflow run release.yml --ref v1.0.0
# ============================================================================

name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, skip publish)"
        required: false
        default: "false"
        type: boolean

# Deny all permissions by default - each job grants only what it needs
permissions: {}

# Only one release at a time - prevent parallel tag pushes from colliding
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel an in-flight release

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ── Gate: reuse CI workflow ─────────────────────────────────────
  quality:
    name: CI
    uses: ./.github/workflows/ci.yml
    # The release gate runs everything push/PR skips EXCEPT the docker-mock
    # integration suite: that one runs locally via `scripts/release_check.sh
    # --full` before the tag is pushed (see its step 8 and the evidence file it
    # writes). Rationale: on a hosted runner the shared mock stack is contended,
    # so a timing flake failed the publish pipeline and cost a 60-minute re-run;
    # locally the same flake costs a targeted re-run and the maintainer decides.
    # Everything deterministic still gates here.
    with:
      run_pcap: true
      run_integration: false
    permissions:
      contents: read

  # ── Build sdist + wheel ─────────────────────────────────────────
  # This job has NO access to secrets - artifacts are built in isolation.
  build:
    name: Build
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Checkout only - no secrets needed for building
    outputs:
      sha256-sdist: ${{ steps.checksums.outputs.sdist }}
      sha256-wheel: ${{ steps.checksums.outputs.wheel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install --only-binary :all: build

      - name: Verify tag matches package version
        # oida's version is dynamic (setuptools attr = oida.__version__), so read
        # it straight from the source module rather than [project].version.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(python -c 'import pathlib,re; m=re.search(r"__version__\s*=\s*(\S+)", pathlib.Path("src/oida/__init__.py").read_text()); print(m.group(1).strip(chr(34)+chr(39)))')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match src/oida/__init__.py (__version__=$PKG_VERSION)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distributions
        run: |
          pip install --only-binary :all: twine
          twine check dist/*

      - name: Generate and export checksums
        id: checksums
        run: |
          echo "── SHA-256 checksums ──"
          sha256sum dist/*
          echo "sdist=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "wheel=$(sha256sum dist/*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: ls -lh dist/

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  # ── Attestation ─────────────────────────────────────────────────
  # SLSA build provenance. GitHub Artifact Attestations require a public repo
  # (or an org repo with Advanced Security), so this is gated and simply skips
  # while the repo is private - it auto-enables when made public. Decoupled from
  # publish so it never blocks a release.
  attest:
    name: Attest provenance
    needs: [build]
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # Required for attestation signing
      attestations: write   # Required to persist attestations
      contents: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: "dist/*"

  # ── Publish to PyPI ─────────────────────────────────────────────
  # Uses OIDC trusted publishing - no long-lived secrets needed.
  # No pip install here - avoids arbitrary code execution in the publish job.
  publish:
    name: Publish to PyPI
    needs: [build]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && !(github.event.inputs.dry_run == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC trusted publishing
      contents: read
    environment:
      name: pypi  # Requires approval - configure reviewers in GitHub settings
      url: https://pypi.org/project/oida-ics/
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist/

      - name: Verify artifact checksums (anti-tampering)
        env:
          EXPECTED_SDIST: ${{ needs.build.outputs.sha256-sdist }}
          EXPECTED_WHEEL: ${{ needs.build.outputs.sha256-wheel }}
        run: |
          echo "── Verifying SHA-256 checksums against build job ──"
          ACTUAL_SDIST="$(sha256sum dist/*.tar.gz | cut -d' ' -f1)"
          ACTUAL_WHEEL="$(sha256sum dist/*.whl | cut -d' ' -f1)"
          echo "sdist: expected=$EXPECTED_SDIST actual=$ACTUAL_SDIST"
          echo "wheel: expected=$EXPECTED_WHEEL actual=$ACTUAL_WHEEL"
          if [ "$EXPECTED_SDIST" != "$ACTUAL_SDIST" ]; then
            echo "::error::sdist checksum mismatch - artifact may have been tampered with"
            exit 1
          fi
          if [ "$EXPECTED_WHEEL" != "$ACTUAL_WHEEL" ]; then
            echo "::error::wheel checksum mismatch - artifact may have been tampered with"
            exit 1
          fi
          echo "Checksums verified successfully"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0

  # ── GitHub Release ──────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and upload assets
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          generate_release_notes: true
          files: |
            dist/*
