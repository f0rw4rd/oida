# ============================================================================
# Release - oida
# ============================================================================
#
# One human-started workflow for every release artifact: the pure-Python
# sdist + wheel (PyPI, on real releases), the standalone Linux/Windows
# binaries (GitHub release, always), and the GitHub release itself.
#
#   dispatch from a v* tag -> legacy flow: the tag must already match
#                     src/oida/__init__.py (checked at build start).
#   tag input set   -> CI-driven tagging: dispatch from main with e.g. tag=1.0.1.
#                     The build job validates format + __version__ match BEFORE
#                     anything builds; the tag itself is created by the final
#                     github-release step only after every job is green. A
#                     version mismatch fails in seconds, not after the pipeline.
#   Anything else   -> the build job fails: a release needs a version.
#
#   dry_run=false   -> full release: PyPI publish + GitHub release with all
#                      artifacts.
#   dry_run=true    -> GitHub PRE-release with all artifacts, PyPI untouched.
#
# Security hardening applied:
#   - Top-level permissions: {} (deny all by default)
#   - All actions pinned to full commit SHA (prevents tag-force-push attacks)
#   - manylinux build image pinned by digest (mutable :latest tags drift)
#   - No curl-piped installers in the artifact build: uv is installed on the
#     runner by setup-uv (SHA-pinned action, cached) and bind-mounted into the
#     build container
#   - OIDC trusted publishing for PyPI (no long-lived API tokens)
#   - Build and publish are separate jobs (build has no secret access)
#   - Publish job uses 'pypi' environment (reviewer approval on plans that
#     support it - NOT available free-private; the dispatch-only trigger is
#     the real gate today)
#   - Checksum verification between build and publish jobs
#   - No pip install in publish job (avoids arbitrary code execution)
#   - persist-credentials: false on all checkouts
#
# This builds the pure-Python sdist + wheel from the project root (src/ layout).
# The standalone binaries are built in the same run (the former
# build-binaries.yml matrix moved here; that workflow and test-release.yml
# were folded into this one).
#
# Required GitHub configuration (one-time, in the web UI - no tokens):
#   Configure the PyPI trusted publisher for project `oida-ics`
#   (pypi.org -> Manage -> Publishing): owner f0rw4rd, repo oida,
#   workflow release.yml, environment pypi.
# ============================================================================

name: Release

on:
  # Human-started only, same reasoning as the old build-binaries.yml (879b902):
  # no unattended run against a tag before it's known-good. A stolen/tokened
  # push to main cannot publish anything; the dispatcher's click is the gate.
  # EXCEPTION: pushing a v* tag itself is the human act - tagging already
  # demands an explicit local decision (and the tag/version agreement check in
  # the build job's first step fails a mismatched tag in seconds), so the
  # dispatch click added nothing but a manual step to forget.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create+release (e.g. 1.0.1). Empty = release an existing ref/tag."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run (GitHub pre-release only, skip PyPI)"
        required: false
        default: "false"
        type: boolean
  push:
    tags:
      - "v*"

# Deny all permissions by default - each job grants only what it needs
permissions: {}

# Only one release at a time - prevent parallel tag pushes from colliding
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel an in-flight release

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ── Fail-fast version guard ─────────────────────────────────────
  # Runs before the multi-minute CI gate: a tag that disagrees with
  # src/oida/__init__.py (the source of the dynamic wheel version) must kill
  # the run in seconds, not after quality has burned its matrix (v1.0.2 nearly
  # shipped 1.0.1 wheels this way - the check existed but only in `build`,
  # behind `quality`).
  version-guard:
    name: Version guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Verify tag/version agreement
        run: |
          # Same resolution rule the tag-input path uses: bare semver from a
          # `tag` input, or GITHUB_REF on a v* tag push (now also a trigger).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG_VERSION="${{ inputs.tag }}"
          else
            echo "::error::No tag input and not a v* tag ref - a release needs a version (dispatch with tag=X.Y.Z, or push a v* tag)"
            exit 1
          fi
          if ! echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version ($TAG_VERSION) is not strict MAJOR.MINOR.PATCH (ref: $GITHUB_REF)"
            exit 1
          fi
          PKG_VERSION="$(python -c 'import pathlib,re; m=re.search(r"__version__\s*=\s*(\S+)", pathlib.Path("src/oida/__init__.py").read_text()); print(m.group(1).strip(chr(34)+chr(39)))')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match src/oida/__init__.py (__version__=$PKG_VERSION). Bump the version (or re-point the tag) and push again."
            exit 1
          fi
          echo "tag/version agree: v$TAG_VERSION"
  # ── Gate: reuse CI workflow ─────────────────────────────────────
  quality:
    name: CI
    uses: ./.github/workflows/ci.yml
    # The release gate runs everything PR CI skips EXCEPT the docker-mock
    # integration suite: that one runs locally via `scripts/release_check.sh
    # --full` before the tag is pushed (see its step 8 and the evidence file it
    # writes). Rationale: on a hosted runner the shared mock stack is contended,
    # so a timing flake failed the publish pipeline and cost a 60-minute re-run;
    # locally the same flake costs a targeted re-run and the maintainer decides.
    # Everything deterministic still gates here.
    with:
      run_pcap: true
      run_integration: false
    permissions:
      contents: read

  # ── Build sdist + wheel ─────────────────────────────────────────
  # This job has NO access to secrets - artifacts are built in isolation.
  build:
    name: Build
    needs: [version-guard, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Checkout only - no secrets needed for building
    outputs:
      sha256-sdist: ${{ steps.checksums.outputs.sdist }}
      sha256-wheel: ${{ steps.checksums.outputs.wheel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          python-version: "3.12"

      # Build/twine via uvx at pinned versions instead of `pip install` latest:
      # the artifact-producing job should not float its tooling (same discipline
      # as ci.yml's "Sync dev tools from lockfile" comment).
      - name: Verify version agreement (tag ref or CI-driven tag input)
        # oida's version is dynamic (setuptools attr = oida.__version__), so read
        # it straight from the source module rather than [project].version.
        # CI-driven flow validates the INPUT here and creates the actual tag in
        # the github-release job, after everything else is green.
        run: |
          WANTED="${{ inputs.tag }}"
          if [ -n "$WANTED" ]; then
            # CI-driven: input is the bare version; v-prefix is applied at tag
            # creation. The input must be a strict semver without the v.
            case "$WANTED" in
              v*) echo "::error::tag input must be the bare version (got: $WANTED)"; exit 1 ;;
            esac
            if ! echo "$WANTED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag input ($WANTED) is not strict MAJOR.MINOR.PATCH"
              exit 1
            fi
            TAG_VERSION="$WANTED"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if ! echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag ${{ github.ref_name }} is not strict semver vMAJOR.MINOR.PATCH (got: $TAG_VERSION)"
              exit 1
            fi
          else
            echo "::error::No tag input and not a v* tag ref - a release needs a version (dispatch with tag=X.Y.Z, or from an existing v* tag)"
            exit 1
          fi
          PKG_VERSION="$(python -c 'import pathlib,re; m=re.search(r"__version__\s*=\s*(\S+)", pathlib.Path("src/oida/__init__.py").read_text()); print(m.group(1).strip(chr(34)+chr(39)))')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Requested version ($TAG_VERSION) does not match src/oida/__init__.py (__version__=$PKG_VERSION)"
            exit 1
          fi

      - name: Build sdist and wheel
        # `build`'s executable is pyproject-build, not build.
        run: uvx --from build==1.6.1 pyproject-build

      - name: Verify distributions
        run: uvx twine==7.0.0 check dist/*

      - name: Generate and export checksums
        id: checksums
        run: |
          echo "── SHA-256 checksums ──"
          sha256sum dist/*
          echo "sdist=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "wheel=$(sha256sum dist/*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: ls -lh dist/

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  # ── Build standalone binaries ───────────────────────────────────
  # The former build-binaries.yml matrix, verbatim except the two supply-chain
  # hardenings noted inline. Produces oida-*-x86_64 artifacts consumed by the
  # github-release job.
  binaries:
    name: Standalone ${{ matrix.label }}
    # After build so a broken dist build fails the run before the binaries
    # spend minutes on it; the binaries themselves don't consume build's
    # artifacts (they sync from the lockfile directly).
    needs: [quality, build]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write       # Required for attestation signing
      attestations: write   # Required to persist attestations
    # Expose whether SignPath is configured, so the Windows signing steps can be
    # gated without referencing secrets in `if:` directly. Stays "false" (steps
    # skipped, build green) until SIGNPATH_API_TOKEN is added.
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            artifact: oida-linux-x86_64
            ext: tar.gz
            # `all` is the pyproject.toml meta-extra that pulls in every
            # protocol + fuzz extra but NOT dev or docs.  Using it here means
            # any new protocol extra added to pyproject.toml (and referenced
            # by `all`) is automatically included in every release build.
            # `dtls` is added explicitly (it is NOT in `all`): DTLSSocket is
            # sdist-only and compiles tinydtls - the release build has the
            # toolchain (~4min in manylinux), end-user pip installs do not.
            # This is what keeps coaps:// in the Linux binary.
            extras: --extra all --extra dtls
          - os: windows-latest
            label: windows-x86_64
            artifact: oida-windows-x86_64
            ext: zip
            # Same extras as Linux; `all` works on Windows and dtls is a
            # no-op there: platform-gated deps (pysoem/ethercat,
            # DTLSSocket/coap, netifaces/discovery) are skipped automatically
            # via sys_platform markers in pyproject.toml.
            extras: --extra all --extra dtls

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      # ── Linux: build inside manylinux_2_28 so pip selects lower-tagged wheels ──
      # Building on ubuntu-latest (glibc 2.39) causes pip to install the
      # manylinux_2_34 cryptography wheel; the resulting binary then requires
      # glibc 2.34 on the target. Inside the manylinux_2_28 container pip
      # selects the manylinux_2_28 wheel instead, dropping the floor to ~2.28.
      # The smoke test runs inside the same container - effectively testing on
      # the minimum supported glibc, which is more meaningful than testing on
      # the 2.39 host runner.
      #
      # The image is pinned BY DIGEST: :latest is mutable, and this container
      # builds the artifact end users download. Re-resolve on a deliberate bump
      # with: docker buildx imagetools inspect quay.io/pypa/manylinux_2_28_x86_64:latest
      # uv is NOT fetched from the network inside the container (no
      # curl|sh installer): setup-uv already installed a known uv on the
      # runner; bind-mount it in read-only.
      - name: Build and smoke-test (Linux, manylinux_2_28)
        if: runner.os == 'Linux'
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          UV_BIN="$(command -v uv)"
          [ -n "$UV_BIN" ] || { echo "::error::uv not found on runner PATH"; exit 1; }
          docker run --rm \
            -e EXTRAS \
            -v "${{ github.workspace }}:/workspace" \
            -v "$UV_BIN:/usr/local/bin/uv:ro" \
            -w /workspace \
            quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328 \
            bash -c '
              export PATH="/usr/local/bin:$PATH"
              export UV_PYTHON_PREFERENCE=only-managed
              uv sync $EXTRAS --python 3.12 --frozen
              # pyinstaller ships in the `dev` dependency-group and is installed
              # (at its uv.lock-pinned version) by the sync above. Only the smoke
              # harness - pytest/pytest-timeout, which sit in the `dev` extra that
              # is not synced here - needs an ad-hoc install.
              uv pip install pytest pytest-timeout
              .venv/bin/pyinstaller oida.spec --clean --noconfirm
              .venv/bin/pytest tests/integration/test_binary_smoke.py -m binary -q
              chown -R "$(stat -c "%u:%g" /workspace)" /workspace/dist
            '

      - name: Report and gate effective glibc floor
        if: runner.os == 'Linux'
        # Verify, not assert: the manylinux_2_28 container makes pip pick
        # 2_28-honest wheels, but a future dependency that ships ONLY
        # manylinux_2_34+ wheels (or an image-tag bump) would silently raise
        # the binary's floor while the build stays green. Compare the measured
        # symbol floor against the promised one and fail before shipping.
        # Raise MAX_SUPPORTED_GLIBC only as a deliberate, documented decision.
        env:
          MAX_SUPPORTED_GLIBC: "2.28"
        run: |
          floor=$(find dist/oida -name "*.so" -o \( -name "oida" -type f \) \
            | xargs -I{} objdump -p {} 2>/dev/null \
            | grep -oP "GLIBC_\d+\.\d+(\.\d+)?" \
            | sort -V | tail -1)
          echo "Effective glibc floor: $floor"
          echo "GLIBC_FLOOR=$floor" >> "$GITHUB_ENV"
          floor_ver="${floor#GLIBC_}"
          max_minor=$(echo "$MAX_SUPPORTED_GLIBC" | cut -d. -f2)
          floor_minor=$(echo "$floor_ver" | cut -d. -f2)
          if [ "$(echo "$floor_ver" | cut -d. -f1)" != "2" ] \
            || [ "$floor_minor" -gt "$max_minor" ]; then
            echo "::error::Binary requires glibc ${floor_ver} but we promise ${MAX_SUPPORTED_GLIBC}. \
          A dependency likely shipped only higher-tagged wheels - either pin a \
          lower version or raise MAX_SUPPORTED_GLIBC deliberately."
            exit 1
          fi

      # ── Windows: run directly on the host runner ────────────────────────────
      - name: Sync runtime deps from lockfile
        if: runner.os == 'Windows'
        # Runtime protocol extras only - the binary bundles exactly these, no
        # dev/test tooling.
        run: uv sync ${{ matrix.extras }} --frozen

      - name: Install smoke-test harness
        if: runner.os == 'Windows'
        # pyinstaller is in the `dev` dependency-group, so the `uv sync` above
        # already installed it at its uv.lock-pinned version. pytest/pytest-timeout
        # (the smoke harness) live in the `dev` extra, which is NOT synced for the
        # release env, so install just those ad-hoc. None of them are runtime deps
        # and none are bundled into the binary (the spec excludes them).
        run: uv pip install pytest pytest-timeout

      - name: Build binary
        if: runner.os == 'Windows'
        run: uv run pyinstaller oida.spec --clean --noconfirm

      - name: Smoke test the binary
        if: runner.os == 'Windows'
        # pyproject sets timeout_method = "signal" (SIGALRM/setitimer), which is
        # Unix-only and makes pytest-timeout crash with an INTERNALERROR on
        # Windows. Override to the cross-platform "thread" method for this run.
        run: uv run pytest tests/integration/test_binary_smoke.py -m binary -q -o timeout_method=thread

      - name: Determine archive name (with version)
        # Tag builds (v1.2.3) use the tag; otherwise the packaged oida version
        # plus a short commit suffix so dev artifacts are distinguishable.
        # `shell: bash` so the same script runs on the Windows runner too.
        # always(): still package + upload the built binary when the smoke test
        # failed, so it can be pulled for debugging. The job itself stays red
        # (the smoke step has no continue-on-error), so a smoke-failing binary
        # never publishes via a real release.
        if: always()
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"; v="${v#v}"; suffix=""
          else
            v="$(grep -m1 '__version__' src/oida/__init__.py | cut -d'"' -f2)"
            suffix="-g${GITHUB_SHA::7}"
          fi
          echo "ARCHIVE=oida-${v}${suffix}-${{ matrix.label }}.${{ matrix.ext }}" >> "$GITHUB_ENV"
          echo "archive -> oida-${v}${suffix}-${{ matrix.label }}.${{ matrix.ext }}"

      - name: Package onedir folder (Linux)
        if: always() && runner.os == 'Linux'
        # Single named archive with a top-level oida/ dir.
        run: tar -C dist -czf "$ARCHIVE" oida

      - name: Package onedir folder (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/oida -DestinationPath "$env:ARCHIVE"

      # ── Authenticode-sign the Windows .exe via SignPath (gated, no-op until
      #    enrolled) ───────────────────────────────────────────────────────────
      # SignPath signs oida/oida.exe inside the zip (see signpath.xml - deep
      # signing) and returns the re-zipped, signed archive. Runs only when
      # SIGNPATH_API_TOKEN is set, so the build stays green before enrollment.
      - name: Upload unsigned archive for SignPath
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsigned-${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

      - name: Sign Windows .exe (SignPath)
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        # Pinned to the v1 tag's commit (was a mutable @v1 - the only unpinned
        # action in the repo). Re-resolve on bump: git ls-remote <repo> refs/tags/v1
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e  # v1
        with:
          connector-url: https://app.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: oida                       # TODO: your SignPath project slug
          signing-policy-slug: release-signing      # TODO: your signing policy slug
          artifact-configuration-slug: windows-zip  # TODO: slug of the uploaded signpath.xml
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true                     # keep it a single .zip file

      - name: Swap in the signed archive
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        shell: bash
        # skip-decompress keeps a single file in signed/; move it over the
        # unsigned one so checksum/attestation/upload all cover the signed zip.
        run: mv signed/* "$ARCHIVE"

      # ── Integrity + provenance (after signing, so they cover the signed file) ─
      - name: Generate SHA-256 checksum
        if: always()
        shell: bash
        run: sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Attest build provenance
        # Sigstore-backed SLSA provenance: proves the archive came from this
        # repo's CI. Verify with: gh attestation verify <archive> --repo f0rw4rd/oida
        # Skipped on PRs (forked-PR id-tokens are restricted) and while the repo
        # is private - GitHub Artifact Attestations require a public repo (or an
        # org repo with Advanced Security). Auto-enables when made public.
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          retention-days: 14

  # ── Attestation ─────────────────────────────────────────────────
  # SLSA build provenance for the pip artifacts. GitHub Artifact Attestations
  # require a public repo (or an org repo with Advanced Security), so this is
  # gated and simply skips while the repo is private - it auto-enables when
  # made public. Decoupled from publish so it never blocks a release.
  attest:
    name: Attest provenance
    needs: [build]
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # Required for attestation signing
      attestations: write   # Required to persist attestations
      contents: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: "dist/*"

  # ── Publish to PyPI ─────────────────────────────────────────────
  # Uses OIDC trusted publishing - no long-lived secrets needed.
  # No pip install here - avoids arbitrary code execution in the publish job.
  publish:
    name: Publish to PyPI
    needs: [build]
    # Only from a v* tag OR a CI-driven tag input, AND a non-dry-run dispatch.
    # Dry runs and any-ref dispatches without a tag input produce GitHub
    # artifacts only.
    if: >-
      (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
      && !(inputs.dry_run == true)
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC trusted publishing
      contents: read
    environment:
      name: pypi  # Reviewer approval on plans that support it (not free-private)
      url: https://pypi.org/project/oida-ics/
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist/

      - name: Verify artifact checksums (anti-tampering)
        env:
          EXPECTED_SDIST: ${{ needs.build.outputs.sha256-sdist }}
          EXPECTED_WHEEL: ${{ needs.build.outputs.sha256-wheel }}
        run: |
          echo "── Verifying SHA-256 checksums against build job ──"
          ACTUAL_SDIST="$(sha256sum dist/*.tar.gz | cut -d' ' -f1)"
          ACTUAL_WHEEL="$(sha256sum dist/*.whl | cut -d' ' -f1)"
          echo "sdist: expected=$EXPECTED_SDIST actual=$ACTUAL_SDIST"
          echo "wheel: expected=$EXPECTED_WHEEL actual=$ACTUAL_WHEEL"
          if [ "$EXPECTED_SDIST" != "$ACTUAL_SDIST" ]; then
            echo "::error::sdist checksum mismatch - artifact may have been tampered with"
            exit 1
          fi
          if [ "$EXPECTED_WHEEL" != "$ACTUAL_WHEEL" ]; then
            echo "::error::wheel checksum mismatch - artifact may have been tampered with"
            exit 1
          fi
          echo "Checksums verified successfully"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  # ── GitHub Release ──────────────────────────────────────────────
  # Carries EVERY release artifact: pip dist + standalone binaries, with a
  # combined SHA256SUMS.txt. Full release on a v* tag; pre-release otherwise.
  github-release:
    name: GitHub Release
    needs: [build, binaries, publish]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and upload assets
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false
          # git-cliff below needs the full history and all tags to find the
          # previous release; the default shallow checkout does not have them.
          fetch-depth: 0

      # Release notes run uvx git-cliff at a pinned version (same discipline
      # as the build job) - uv is not preinstalled on the runner.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"

      - name: Compute release metadata
        id: meta
        run: |
          WANTED="${{ inputs.tag }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"; suffix=""
            tag_name="${GITHUB_REF_NAME}"
          else
            # CI-driven: create the tag on this commit. Reached only after the
            # whole pipeline is green - the tag's first act is to exist on a
            # releasable commit, so tag/version skew is structurally impossible.
            ver="$WANTED"; suffix=""
            tag_name="v${WANTED}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # NOT path: assets/ - the repo tracks a branding dir of that name, and
      # download-artifact merges into an existing directory, which is how the
      # brand icons ended up checksummed into SHA256SUMS.txt and uploaded as
      # release assets on v1.0.1. release-assets/ exists only in CI.
      - name: Download pip dist (wheel + sdist)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: release-assets/

      - name: Download standalone binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: oida-*-x86_64  # the per-OS artifacts uploaded by the binaries job
          merge-multiple: true
          path: release-assets/

      - name: Generate combined checksums
        run: |
          cd release-assets
          # Drop the per-binary .sha256 sidecars so SHA256SUMS.txt lists only
          # the actual distributable files (wheel, sdist, binary archives).
          rm -f *.sha256
          sha256sum * > SHA256SUMS.txt
          echo "── release assets ──"; ls -lh

      # Release notes: git-cliff section for exactly this tag's commits.
      # generate_release_notes only lists labeled PRs, which never covers
      # direct pushes to main - the normal flow here - so the notes section
      # came up empty on v1.0.1. The generated-notes section is still
      # appended (generate_release_notes: true) for its contributor list.
      - name: Generate release notes from git history
        id: notes
        run: |
          tag="${{ steps.meta.outputs.tag_name }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            # Tag-push path: the tag exists; cover exactly its commits.
            prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
            range_end="$tag"
          else
            # CI-driven path: the tag does not exist yet - softprops creates
            # it on this SHA after this step. Range = last reachable tag..HEAD.
            prev="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
            range_end="HEAD"
          fi
          if [ -n "$prev" ]; then
            range="${prev}..${range_end}"
          else
            # First tag ever: everything reachable.
            range="$range_end"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          # --tag satisfies the version template on the CI-driven path where
          # the tag object does not exist yet; --strip footer drops the
          # "do not edit" trailing comment.
          uvx git-cliff==2.14.2 --tag "$tag" \
            --strip footer "$range" > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          # On the CI-driven path softprops creates v<version> on
          # target_commitish (this run's SHA) with its own contents:write
          # permission.
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "oida ${{ steps.meta.outputs.version }}${{ steps.meta.outputs.suffix }}"
          body_path: release-notes.md
          files: |
            release-assets/*
