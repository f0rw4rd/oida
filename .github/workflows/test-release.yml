# ============================================================================
# Test Release (GitHub-only) — oida
# ============================================================================
#
# Publishes a GitHub *pre-release* that carries:
#   - the pure-Python sdist + wheel (the exact artifacts release.yml would send
#     to PyPI) — but this workflow NEVER touches PyPI
#   - the standalone PyInstaller binaries (Linux + Windows x86_64), built by
#     reusing build-binaries.yml via workflow_call (no duplicated build matrix)
#
# Use it to dry-run the packaging + binary build and hand testers real,
# installable artifacts without cutting a PyPI release.
#
# To cut a test release:
#   git tag v0.9.9-rc1 && git push origin v0.9.9-rc1
#   (any vX.Y.Z-<suffix> tag works: -rc1, -test, -beta2, ...)
#
# A plain vX.Y.Z tag goes through release.yml (PyPI) instead. This workflow
# only reacts to the pre-release suffix (the "-<suffix>" part), and
# build-binaries.yml no longer auto-fires on suffixed tags, so the PyPI path,
# the standalone-binary path, and this test path never collide on one tag.
# ============================================================================

name: Test Release (GitHub only)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Deny all permissions by default — each job grants only what it needs.
permissions: {}

# One test release at a time per tag.
concurrency:
  group: test-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ── Gate: reuse CI ──────────────────────────────────────────────
  quality:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ── Build sdist + wheel (NEVER published to PyPI) ───────────────
  build-dist:
    name: Build sdist + wheel
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Checkout only — no secrets, no PyPI.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install --only-binary :all: build

      - name: Sanity-check tag base vs package version
        # The tag carries a pre-release suffix (v1.2.3-rc1), so it won't equal
        # __version__ exactly; compare only the X.Y.Z base and WARN (never fail)
        # so a test release is easy to cut mid-development.
        run: |
          TAG_BASE="${GITHUB_REF#refs/tags/v}"; TAG_BASE="${TAG_BASE%%-*}"
          PKG_VERSION="$(python -c 'import pathlib,re; m=re.search(r"__version__\s*=\s*(\S+)", pathlib.Path("src/oida/__init__.py").read_text()); print(m.group(1).strip(chr(34)+chr(39)))')"
          echo "tag base = $TAG_BASE ; package __version__ = $PKG_VERSION"
          if [ "$TAG_BASE" != "$PKG_VERSION" ]; then
            echo "::warning::Tag base ($TAG_BASE) != src/oida/__init__.py (__version__=$PKG_VERSION) — building anyway (test release)."
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distributions
        run: |
          pip install --only-binary :all: twine
          twine check dist/*

      - name: List artifacts
        run: ls -lh dist/

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  # ── Build standalone binaries (reuse build-binaries.yml) ────────
  # secrets: inherit forwards SIGNPATH_API_TOKEN so the gated Windows-signing
  # steps behave identically to a direct build-binaries run (no-op until
  # enrolled). No secret is required for the build itself.
  binaries:
    name: Standalone binaries
    needs: [quality]
    permissions:
      contents: read
      id-token: write      # Sigstore-backed provenance attestation (public repo)
      attestations: write
    uses: ./.github/workflows/build-binaries.yml
    secrets: inherit

  # ── GitHub pre-release (pip dist + binaries, NO PyPI) ───────────
  github-release:
    name: GitHub pre-release
    needs: [build-dist, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create the release and upload assets.
    steps:
      - name: Download pip dist (wheel + sdist)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: assets/

      - name: Download standalone binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: oida-*-x86_64  # the per-OS artifacts uploaded by build-binaries.yml
          merge-multiple: true
          path: assets/

      - name: Generate combined checksums
        run: |
          cd assets
          # Drop the per-binary .sha256 sidecars so SHA256SUMS.txt lists only
          # the actual distributable files (wheel, sdist, binary archives).
          rm -f *.sha256
          sha256sum * > SHA256SUMS.txt
          echo "── release assets ──"; ls -lh

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # v2.5.0
        with:
          prerelease: true
          generate_release_notes: true
          name: "oida ${{ github.ref_name }} (test)"
          body: |
            **Test / pre-release build — not published to PyPI.**

            This release carries the pip artifacts (wheel + sdist) and the
            standalone binaries (Linux / Windows x86_64).

            Install the wheel directly:

            ```
            pip install oida-*.whl
            ```

            …or download a standalone binary archive (no Python required).
            Verify downloads against `SHA256SUMS.txt`.
          files: |
            assets/*
