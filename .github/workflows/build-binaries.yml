name: Build standalone binaries

# Builds the single-file `oida` executable for Linux and Windows (x86_64) with
# PyInstaller (oida.spec) and validates each with the binary smoke test.
# Triggered manually or on release tags; artifacts are uploaded per-OS.

on:
  workflow_dispatch:
  # Reusable: test-release.yml calls this via `uses:` to attach the standalone
  # binaries to a GitHub-only pre-release without duplicating the build matrix.
  workflow_call:
  # Stable + post tags build binaries automatically. Pre-release tags
  # (vX.Y.Z-rc1 / -test / -beta2 / ...) are owned by test-release.yml, which
  # reuses this workflow via workflow_call — excluded here to avoid a double
  # build on the same tag. The PR re-validation trigger was removed to conserve
  # Actions minutes (run manually via workflow_dispatch instead).
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.post[0-9]+"

permissions:
  contents: read
  id-token: write      # for Sigstore-backed build-provenance attestations
  attestations: write  # to write the attestation to the repo

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Expose whether SignPath is configured, so the Windows signing steps can be
    # gated without referencing secrets in `if:` directly. Stays "false" (steps
    # skipped, build green) until SIGNPATH_API_TOKEN is added.
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            artifact: oida-linux-x86_64
            ext: tar.gz
            # `all` is the pyproject.toml meta-extra that pulls in every
            # protocol + fuzz extra but NOT dev or docs.  Using it here means
            # any new protocol extra added to pyproject.toml (and referenced
            # by `all`) is automatically included in every release build.
            extras: --extra all
          - os: windows-latest
            label: windows-x86_64
            artifact: oida-windows-x86_64
            ext: zip
            # `all` works on Windows: platform-gated deps (pysoem/ethercat,
            # DTLSSocket/coap, netifaces/discovery) are skipped automatically
            # via sys_platform markers in pyproject.toml.
            extras: --extra all

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        if: runner.os == 'Windows'
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      # ── Linux: build inside manylinux_2_28 so pip selects lower-tagged wheels ──
      # Building on ubuntu-latest (glibc 2.39) causes pip to install the
      # manylinux_2_34 cryptography wheel; the resulting binary then requires
      # glibc 2.34 on the target. Inside the manylinux_2_28 container pip
      # selects the manylinux_2_28 wheel instead, dropping the floor to ~2.28.
      # The smoke test runs inside the same container — effectively testing on
      # the minimum supported glibc, which is more meaningful than testing on
      # the 2.39 host runner.
      - name: Build and smoke-test (Linux, manylinux_2_28)
        if: runner.os == 'Linux'
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          docker run --rm \
            -e EXTRAS \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -c '
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
              export UV_PYTHON_PREFERENCE=only-managed
              uv sync $EXTRAS --python 3.12 --frozen
              # pyinstaller ships in the `dev` dependency-group and is installed
              # (at its uv.lock-pinned version) by the sync above. Only the smoke
              # harness — pytest/pytest-timeout, which sit in the `dev` extra that
              # is not synced here — needs an ad-hoc install.
              uv pip install pytest pytest-timeout
              .venv/bin/pyinstaller oida.spec --clean --noconfirm
              .venv/bin/pytest tests/integration/test_binary_smoke.py -m binary -q
              chown -R "$(stat -c "%u:%g" /workspace)" /workspace/dist
            '

      - name: Report effective glibc floor
        if: runner.os == 'Linux'
        run: |
          floor=$(find dist/oida -name "*.so" -o \( -name "oida" -type f \) \
            | xargs -I{} objdump -p {} 2>/dev/null \
            | grep -oP "GLIBC_\d+\.\d+(\.\d+)?" \
            | sort -V | tail -1)
          echo "Effective glibc floor: $floor"
          echo "GLIBC_FLOOR=$floor" >> "$GITHUB_ENV"

      # ── Windows: run directly on the host runner ────────────────────────────
      - name: Sync runtime deps from lockfile
        if: runner.os == 'Windows'
        # Runtime protocol extras only — the binary bundles exactly these, no
        # dev/test tooling.
        run: uv sync ${{ matrix.extras }} --frozen

      - name: Install smoke-test harness
        if: runner.os == 'Windows'
        # pyinstaller is in the `dev` dependency-group, so the `uv sync` above
        # already installed it at its uv.lock-pinned version. pytest/pytest-timeout
        # (the smoke harness) live in the `dev` extra, which is NOT synced for the
        # release env, so install just those ad-hoc. None of them are runtime deps
        # and none are bundled into the binary (the spec excludes them).
        run: uv pip install pytest pytest-timeout

      - name: Build binary
        if: runner.os == 'Windows'
        run: uv run pyinstaller oida.spec --clean --noconfirm

      - name: Smoke test the binary
        if: runner.os == 'Windows'
        # pyproject sets timeout_method = "signal" (SIGALRM/setitimer), which is
        # Unix-only and makes pytest-timeout crash with an INTERNALERROR on
        # Windows. Override to the cross-platform "thread" method for this run.
        run: uv run pytest tests/integration/test_binary_smoke.py -m binary -q -o timeout_method=thread

      - name: Determine archive name (with version)
        # Tag builds (v1.2.3) use the tag; otherwise the packaged oida version
        # plus a short commit suffix so dev artifacts are distinguishable.
        # `shell: bash` so the same script runs on the Windows runner too.
        # always(): still package + upload the built binary when the smoke test
        # failed, so it can be pulled for debugging. The job itself stays red
        # (the smoke step has no continue-on-error), so a smoke-failing binary
        # never publishes via a real release.
        if: always()
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"; v="${v#v}"; suffix=""
          else
            v="$(grep -m1 '__version__' src/oida/__init__.py | cut -d'"' -f2)"
            suffix="-g${GITHUB_SHA::7}"
          fi
          echo "ARCHIVE=oida-${v}${suffix}-${{ matrix.label }}.${{ matrix.ext }}" >> "$GITHUB_ENV"
          echo "archive -> oida-${v}${suffix}-${{ matrix.label }}.${{ matrix.ext }}"

      - name: Package onedir folder (Linux)
        if: always() && runner.os == 'Linux'
        # Single named archive with a top-level oida/ dir.
        run: tar -C dist -czf "$ARCHIVE" oida

      - name: Package onedir folder (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/oida -DestinationPath "$env:ARCHIVE"

      # ── Authenticode-sign the Windows .exe via SignPath (gated, no-op until
      #    enrolled) ───────────────────────────────────────────────────────────
      # SignPath signs oida/oida.exe inside the zip (see signpath.xml — deep
      # signing) and returns the re-zipped, signed archive. Runs only when
      # SIGNPATH_API_TOKEN is set, so the build stays green before enrollment.
      - name: Upload unsigned archive for SignPath
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsigned-${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

      - name: Sign Windows .exe (SignPath)
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1  # TODO: pin to a commit SHA
        with:
          connector-url: https://app.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: oida                       # TODO: your SignPath project slug
          signing-policy-slug: release-signing      # TODO: your signing policy slug
          artifact-configuration-slug: windows-zip  # TODO: slug of the uploaded signpath.xml
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true                     # keep it a single .zip file

      - name: Swap in the signed archive
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        shell: bash
        # skip-decompress keeps a single file in signed/; move it over the
        # unsigned one so checksum/attestation/upload all cover the signed zip.
        run: mv signed/* "$ARCHIVE"

      # ── Integrity + provenance (after signing, so they cover the signed file) ─
      - name: Generate SHA-256 checksum
        if: always()
        shell: bash
        run: sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Attest build provenance
        # Sigstore-backed SLSA provenance: proves the archive came from this
        # repo's CI. Verify with: gh attestation verify <archive> --repo f0rw4rd/oida
        # Skipped on PRs (forked-PR id-tokens are restricted) and while the repo
        # is private — GitHub Artifact Attestations require a public repo (or an
        # org repo with Advanced Security). Auto-enables when made public.
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 14
