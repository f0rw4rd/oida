name: Build standalone binaries

# Builds the single-file `oida` executable for Linux and Windows (x86_64) with
# PyInstaller (oida.spec) and validates each with the binary smoke test.
# Triggered manually or on release tags; artifacts are uploaded per-OS.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    # Re-validate the build whenever the spec or this workflow changes.
    paths:
      - "oida.spec"
      - ".github/workflows/build-binaries.yml"

permissions:
  contents: read
  id-token: write      # for Sigstore-backed build-provenance attestations
  attestations: write  # to write the attestation to the repo

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Expose whether SignPath is configured, so the Windows signing steps can be
    # gated without referencing secrets in `if:` directly. Stays "false" (steps
    # skipped, build green) until SIGNPATH_API_TOKEN is added.
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            artifact: oida-linux-x86_64
            ext: tar.gz
            # Every protocol extra resolves on Linux. Runtime extras only —
            # NOT --all-extras, which would drag dev/docs/fuzz into a release
            # build env.
            extras: >-
              --extra ads --extra bacnet --extra can --extra coap --extra dicom
              --extra discovery --extra dnp3 --extra ethercat --extra ethernetip
              --extra fhir --extra goose --extra hart --extra hl7 --extra iec104
              --extra knx --extra mms --extra modbus --extra mqtt --extra opcua
              --extra pcap --extra profinet --extra snap7 --extra snmp
              --extra tase2 --extra astm --extra ocpp --extra fuzz
          - os: windows-latest
            label: windows-x86_64
            artifact: oida-windows-x86_64
            ext: zip
            # goose/mms/tase2 (pyiec61850-ng) and dnp3 (yadnp3) are Linux-only
            # native libs with no Windows wheels; those protocols still expose
            # `--help` via lazy imports, they're just not bundled for live scans.
            extras: >-
              --extra ads --extra bacnet --extra can --extra coap --extra dicom
              --extra discovery --extra ethercat --extra ethernetip --extra fhir
              --extra hart --extra hl7 --extra iec104 --extra knx --extra modbus
              --extra mqtt --extra opcua --extra pcap --extra profinet
              --extra snap7 --extra snmp --extra astm --extra ocpp --extra fuzz

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync runtime deps from lockfile
        # Runtime protocol extras only — the binary bundles exactly these, no
        # dev/test tooling.
        run: uv sync ${{ matrix.extras }} --frozen

      - name: Install build + test tools
        # pyinstaller (build) and pytest (smoke harness) are NOT runtime deps
        # and are NOT bundled into the binary (the spec excludes pytest). They
        # live outside pyproject/uv.lock so the lockfile-drift contract test
        # stays green and the release env carries no dev extra.
        run: uv pip install pyinstaller pytest pytest-timeout

      - name: Build binary
        run: uv run pyinstaller oida.spec --clean --noconfirm

      - name: Smoke test the binary
        run: uv run pytest tests/integration/test_binary_smoke.py -m binary -q

      - name: Determine archive name (with version)
        # Tag builds (v1.2.3) use the tag; otherwise the packaged oida version
        # plus a short commit suffix so dev artifacts are distinguishable.
        # `shell: bash` so the same script runs on the Windows runner too.
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"; v="${v#v}"; suffix=""
          else
            v="$(uv run python -c 'import importlib.metadata as m; print(m.version("oida"))')"
            suffix="-g${GITHUB_SHA::7}"
          fi
          echo "ARCHIVE=oida-${v}${suffix}-${{ matrix.label }}.${{ matrix.ext }}" >> "$GITHUB_ENV"
          echo "archive -> oida-${v}${suffix}-${{ matrix.label }}.${{ matrix.ext }}"

      - name: Package onedir folder (Linux)
        if: runner.os == 'Linux'
        # Single named archive with a top-level oida/ dir.
        run: tar -C dist -czf "$ARCHIVE" oida

      - name: Package onedir folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/oida -DestinationPath "$env:ARCHIVE"

      # ── Authenticode-sign the Windows .exe via SignPath (gated, no-op until
      #    enrolled) ───────────────────────────────────────────────────────────
      # SignPath signs oida/oida.exe inside the zip (see signpath.xml — deep
      # signing) and returns the re-zipped, signed archive. Runs only when
      # SIGNPATH_API_TOKEN is set, so the build stays green before enrollment.
      - name: Upload unsigned archive for SignPath
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: unsigned-${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

      - name: Sign Windows .exe (SignPath)
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1  # TODO: pin to a commit SHA
        with:
          connector-url: https://app.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: oida                       # TODO: your SignPath project slug
          signing-policy-slug: release-signing      # TODO: your signing policy slug
          artifact-configuration-slug: windows-zip  # TODO: slug of the uploaded signpath.xml
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true                     # keep it a single .zip file

      - name: Swap in the signed archive
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        shell: bash
        # skip-decompress keeps a single file in signed/; move it over the
        # unsigned one so checksum/attestation/upload all cover the signed zip.
        run: mv signed/* "$ARCHIVE"

      # ── Integrity + provenance (after signing, so they cover the signed file) ─
      - name: Generate SHA-256 checksum
        shell: bash
        run: sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Attest build provenance
        # Sigstore-backed SLSA provenance: proves the archive came from this
        # repo's CI. Verify with: gh attestation verify <archive> --repo f0rw4rd/oida
        # Skipped on PRs (no need; and forked-PR id-tokens are restricted).
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 14
