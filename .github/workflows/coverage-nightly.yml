name: Coverage (scorecards, manual)

# Real-coverage suite (tests/coverage/) — the axes that need the live docker
# mock stack and are too slow/heavy for the PR lane. Runs axis-1 scanner field
# coverage (how much of each protocol's tshark field surface a scanner actually
# populates) and axis-2 CVE replication (drive each protocol fuzzer at its
# vulnerable mock and record whether it crashed). Neither gates PRs — they
# publish trend scorecards.
#
# The fuzzer×mock pairs are discovered from the compose `oida.*` labels at
# collection time, so this needs no per-CVE maintenance here.

# Manual-only. The cron was dropped: two jobs at 90 + 60 min timeouts, every
# night, for a suite that by design never gates anything — it was the largest
# standing Actions bill in the repo. A scorecard is worth running when you want
# to read it (before a release, after a fuzzer change), not at 04:00 daily.
on:
  workflow_dispatch:
    inputs:
      case_cap:
        description: "Per-pair fuzz test-case budget (index_end)"
        required: false
        default: "1500"

permissions:
  contents: read

jobs:
  cve-replication:
    name: CVE replication (axis 2)
    runs-on: ubuntu-latest
    # A crashed mock or a single fuzzer error must not sink the whole job —
    # the suite records those as scorecard rows, and we always want the
    # artifact. Hard assertions exist only for VERIFIED_REPRODUCTIONS.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync environment from lockfile
        run: uv sync --all-extras --frozen

      - name: Bring up the CVE mock stack
        # Pulls prebuilt mock images where published; builds the rest. The
        # per-mock `restart: "no"` means a mock the fuzzer crashes stays down —
        # that's the intended signal, not a failure.
        run: uv run python services.py up cve --quiet-pull

      - name: Run CVE-replication suite
        env:
          OIDA_COVERAGE_RUN_ID: ${{ github.run_id }}
          OIDA_CVE_CASE_CAP: ${{ github.event.inputs.case_cap || '1500' }}
        # Assertions only fire for verified pairs; everything else is a
        # recorded data point. A verified-pair regression SHOULD fail the job.
        run: uv run pytest tests/coverage/fuzz/ -m cve_replication -v --timeout=0

      - name: Upload CVE-replication scorecard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cve-replication-scorecard-${{ github.run_id }}
          path: tests/coverage/results/cve_replication_*.json
          if-no-files-found: warn

      - name: Tear down mocks
        if: always()
        run: uv run python services.py down || true

  scanner-field-coverage:
    name: Scanner field coverage (axis 1)
    runs-on: ubuntu-latest
    # tests/coverage/scanner measures how much of each protocol's tshark field
    # surface a scanner actually populates. Its own docstring says "only the
    # nightly coverage job runs it" — but until this job existed it ran in no
    # workflow, and the one place it did run (scripts/run-all-tests.sh) is strict,
    # which turned its designed-in "target unreachable" skips into hard failures.
    # Scorecard only, like the CVE axis: never gates.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync environment from lockfile
        run: uv sync --all-extras --frozen

      - name: Bring up the core mock stack
        run: uv run python services.py up core --quiet-pull

      - name: Run scanner field-coverage suite
        continue-on-error: true
        env:
          OIDA_COVERAGE_RUN_ID: ${{ github.run_id }}
        run: uv run pytest tests/coverage/scanner -m coverage -v --timeout=0

      - name: Upload scanner scorecard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: scanner-field-coverage-${{ github.run_id }}
          path: tests/coverage/results/scanner_*.json
          if-no-files-found: warn

      - name: Tear down mocks
        if: always()
        run: uv run python services.py down || true
