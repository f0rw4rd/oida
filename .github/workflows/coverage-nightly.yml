name: Real-Coverage Nightly

# Runs the three real-coverage axes against the full docker mock stack:
#   Axis 1: scanner field-coverage % vs ref/<proto>/tshark_fields.json
#   Axis 2: fuzzer CVE replication (per-CVE crash assertion)
#   Axis 3: Conpot-vs-Python-mock fidelity diff
#
# Not part of PR CI — too long, needs the full docker stack up. Runs on a
# cron schedule. Publishes a dashboard artifact and (manually triggered)
# commits it to the `coverage-dashboard` branch for visibility.

on:
  schedule:
    # 03:00 UTC daily — pick a slot off-peak for shared runners.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      axes:
        description: "Which axes to run (comma-separated: scanner,fuzz,fidelity,all)"
        required: false
        default: "all"

permissions:
  contents: write   # for the dashboard-branch commit
  actions: read

concurrency:
  # Only one nightly at a time — they take ~30 min each.
  group: coverage-nightly
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHON_VERSION: "3.12"
      AXES: ${{ github.event.inputs.axes || 'all' }}

    steps:
      # persist-credentials: true (default) — needed by the
      # "Publish dashboard" step's git push.
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - name: Set up uv (handles Python toolchain + lockfile-based install)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install OIDA + dev + all extras from lockfile
        # --frozen errors if uv.lock is out of date; ensures the nightly
        # tests the same exact dep set committed to the repo. The
        # pytest-json-report extra is dev-only and lives in the dev extra.
        run: |
          uv sync --all-extras --frozen
          uv pip install pytest-json-report

      - name: Bring up mock stack
        # Best-effort: some mock images (e.g. mms-libiec61850) are not
        # published and a few CVE build-contexts may be absent on a clean
        # runner. The axis steps below already tolerate missing mocks
        # (|| true) and the dashboard reports "not run", so a partial/failed
        # stack must not hard-fail the nightly.
        continue-on-error: true
        run: |
          uv run python services.py up all
          # Give containers a beat to settle; per-test fixture also waits.
          sleep 20
          uv run python services.py status

      - name: Axis 1 — scanner field-coverage
        if: contains(env.AXES, 'scanner') || env.AXES == 'all'
        run: |
          uv run pytest tests/coverage/scanner/ -q \
            --json-report --json-report-file=scanner.json \
            -o junit_family=xunit2 --junitxml=scanner-junit.xml \
          || true

      - name: Axis 2 — fuzzer CVE replication
        if: contains(env.AXES, 'fuzz') || env.AXES == 'all'
        run: |
          # Also start the CVE mock stack
          docker compose -f docker/mocks/compose.cve.yml up -d || true
          sleep 15
          uv run pytest tests/coverage/fuzz/ -q -m cve_replication \
            --json-report --json-report-file=fuzz.json \
            -o junit_family=xunit2 --junitxml=fuzz-junit.xml \
          || true

      - name: Axis 3 — Conpot fidelity diff
        if: contains(env.AXES, 'fidelity') || env.AXES == 'all'
        run: |
          uv run pytest tests/coverage/fidelity/ -q -m fidelity \
            --json-report --json-report-file=fidelity.json \
            -o junit_family=xunit2 --junitxml=fidelity-junit.xml \
          || true

      - name: Generate dashboard.md
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          lines = [f"# OIDA Real-Coverage Dashboard — {datetime.now(timezone.utc).strftime('%Y-%m-%d')}"]
          for axis, label in (("scanner", "SCANNER FIELD-COVERAGE"),
                              ("fuzz",    "FUZZER CVE REPLICATION"),
                              ("fidelity","FIDELITY (vs Conpot)")):
              f = Path(f"{axis}.json")
              lines += ["", f"## {label}", ""]
              if not f.exists():
                  lines.append("_(not run this cycle)_")
                  continue
              data = json.loads(f.read_text())
              summary = data.get("summary", {})
              lines.append(
                  f"- {summary.get('passed', 0)} passed / "
                  f"{summary.get('failed', 0)} failed / "
                  f"{summary.get('skipped', 0)} skipped "
                  f"({summary.get('total', 0)} total)"
              )
          Path("dashboard.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: coverage-nightly-${{ github.run_number }}
          path: |
            scanner.json
            scanner-junit.xml
            fuzz.json
            fuzz-junit.xml
            fidelity.json
            fidelity-junit.xml
            dashboard.md
            tests/coverage/results/
          retention-days: 30

      - name: Publish dashboard to coverage-dashboard branch
        if: github.event_name == 'schedule' && always()
        run: |
          git config user.name "oida-coverage-bot"
          git config user.email "noreply@github.com"
          # Use orphan branch so history doesn't bloat
          git checkout --orphan coverage-dashboard-new
          git rm -rf . || true
          mv dashboard.md README.md
          git add README.md
          git commit -m "coverage dashboard $(date -u +%Y-%m-%d)"
          git branch -D coverage-dashboard 2>/dev/null || true
          git branch -M coverage-dashboard
          git push -f origin coverage-dashboard
        continue-on-error: true   # never break the nightly on dashboard publish failure

      - name: Bring down mock stack
        if: always()
        run: uv run python services.py down || true
