name: PR quick check

# Lightweight auto-gate for pull requests. The full test/lint matrix in ci.yml
# is manual (workflow_dispatch); this runs on every PR so obvious lint/format
# breakage is caught fast (~seconds with the uv cache) without the full suite.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quick:
    name: Ruff lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync dev tools from lockfile
        run: uv sync --extra dev --frozen

      - name: Ruff lint
        run: uv run ruff check src/oida/

      - name: Ruff format check
        run: uv run ruff format --check src/oida/
