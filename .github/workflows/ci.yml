name: CI

on:
  # CI runs automatically. It was previously manual-only, and the result was
  # that it never ran at all: 628k LOC landed with no automated check, and the
  # vulture gate sat red on committed code unnoticed.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # Allow release.yml to reuse this as a pre-publish quality gate

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      # uv handles both the toolchain (Python 3.12 via uv python install)
      # and the lint tools (ruff/vulture/bandit are in the dev extra).
      # No separate actions/setup-python step needed.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync dev tools from lockfile
        # `uv sync --extra dev --frozen` installs ruff/vulture/bandit at
        # the EXACT versions pinned in uv.lock. Don't `uv pip install
        # ruff vulture bandit` — that bypasses the lockfile and fetches
        # latest from PyPI, breaking reproducibility.
        run: uv sync --extra dev --frozen

      - name: Ruff lint
        run: uv run ruff check src/oida/

      - name: Ruff format check
        run: uv run ruff format --check src/oida/

      # Strict rules (BLE001, ARG, RUF012, TRY, ...) still have thousands of
      # pre-existing violations, so they are enforced on changed files only.
      # Needs full history to diff against the base ref.
      - name: Ruff strict (changed files)
        run: |
          git fetch --no-tags --depth=50 origin "${GITHUB_BASE_REF:-main}" || true
          ./scripts/quality/lint-changed.sh "origin/${GITHUB_BASE_REF:-main}"

      # Confidence 60, not 80: at 80 vulture only sees unused variables, and
      # every dead method/class in the audit sits in the 60-79 band.
      - name: Vulture dead code (ratcheted)
        run: uv run python scripts/quality/vulture_gate.py

      - name: Cross-file structural duplication
        run: uv run python scripts/quality/structural_clones.py src/oida --baseline .quality/clones.json --fail-on-new

      - name: Low-assurance test detection
        run: uv run python scripts/quality/test_quality.py tests/ --baseline .quality/tests.json

      # B110/B112 are no longer skipped — they were the mechanism behind three
      # security checks that reported "clean" after crashing. Existing sites are
      # baselined; new ones fail.
      - name: Bandit security lint
        run: uv run bandit -r src/oida/ -c pyproject.toml -b .quality/bandit-baseline.json -q

      # Gates only the bug-shaped mypy codes (union-attr, index, arg-type, ...)
      # against a shrinking baseline. Cosmetic codes (no-untyped-def) and the
      # dynamic-attr noise (attr-defined) are intentionally NOT gated. New
      # None/union/arg-type errors fail; fix them, don't baseline them.
      - name: Mypy bug-shaped types (ratcheted)
        run: uv run python scripts/quality/mypy_gate.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # python-version influences which interpreter `uv sync` picks
          # when no .python-version file matches the matrix.
          python-version: ${{ matrix.python-version }}

      - name: Sync environment from lockfile
        # `uv sync --all-extras` materializes EXACT versions from uv.lock —
        # the same set every CI run, every dev box. --frozen errors if
        # uv.lock is out of date vs pyproject.toml (caught by the
        # lockfile-drift contract test, but belt-and-braces here too).
        run: uv sync --all-extras --frozen

      - name: Unit tests
        # tests/unit/pcap/ and tests/unit/fuzz/test_tshark_validation.py shell
        # out to the real tshark binary and assert on its dissector output, so
        # they are integration-grade and sensitive to the runner's tshark
        # version (CI ships 4.2.x, dev boxes run 4.6.x). They are excluded from
        # the fast/deterministic unit lane — which has no tshark at all, and
        # tests/service_gate.py turns a missing dependency into a hard failure
        # rather than a skip — and run in the `pcap` job with a pinned tshark.
        # tests/contracts/ are fast static repo-invariant guards (confirm-gate,
        # credential-leak, dead-import resolution, …) — run them here so they
        # actually gate PRs.
        run: >-
          uv run pytest tests/unit/ tests/contracts/
          --ignore=tests/unit/pcap
          --ignore=tests/unit/fuzz/test_tshark_validation.py
          -x -q --timeout=15

  pcap:
    name: Dissector tests (pinned tshark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync environment from lockfile
        run: uv sync --all-extras --frozen

      # The job the `test` step's comment has been promising: tests/unit/pcap
      # and the fuzzer's baseline-payload dissector check assert on real tshark
      # dissector output, so they need a tshark whose version is known rather
      # than whatever the runner image happens to ship.
      - name: Install tshark
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1

      - name: Dissector tests
        run: >-
          uv run pytest tests/unit/pcap tests/unit/fuzz/test_tshark_validation.py
          -q --timeout=60

  integration:
    name: Integration (docker mocks)
    runs-on: ubuntu-latest
    # 5,448 tests that ran in no workflow before this job existed — the mock
    # stack makes them too heavy for the unit lane but they are the only
    # coverage the protocol scanners get against real servers.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync environment from lockfile
        run: uv sync --all-extras --frozen

      - name: Bring up the core mock stack
        run: uv run python services.py up core --quiet-pull

      # Same topology as scripts/run-all-tests.sh: --dist loadgroup keeps each
      # xdist_group (one per shared mock) pinned to a single worker. Workers are
      # half the runner's cores, clamped to [2, 4]: each integration test spawns
      # an oida subprocess (~2 cores) and shares the one mock stack, so a
      # worker-per-core run oversubscribes the box and makes timing-sensitive
      # scans miss their timeouts and flake. The upper cap holds regardless of
      # core count because the shared mock stack — not the CPU — is the limit,
      # so a bigger runner must not push more workers at it.
      - name: Integration tests
        run: |
          workers=$(( $(nproc) / 2 ))
          [ "$workers" -lt 2 ] && workers=2
          [ "$workers" -gt 4 ] && workers=4
          echo "Running integration tests with -n $workers on $(nproc) cores"
          uv run pytest tests/integration -p no:randomly -n "$workers" --dist loadgroup

      # `services.py logs` follows and would hang the job, so report status only.
      - name: Mock status on failure
        if: failure()
        run: uv run python services.py status || true

      - name: Tear down mocks
        if: always()
        run: uv run python services.py down || true
