name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff vulture bandit

      - name: Ruff lint
        run: ruff check src/oida/

      - name: Ruff format check
        run: ruff format --check src/oida/

      - name: Vulture dead code
        run: vulture src/oida/ .vulture_whitelist.py --min-confidence 80

      - name: Bandit security lint
        run: bandit -r src/oida/ -c pyproject.toml -q

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install package (with all protocol extras so tests don't silently skip)
        run: pip install -e .[dev,all]

      - name: Unit tests
        run: pytest tests/unit/ -x -q --timeout=15
