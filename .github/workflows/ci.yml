name: CI

on:
  # CI runs automatically. It was previously manual-only, and the result was
  # that it never ran at all: 628k LOC landed with no automated check, and the
  # vulture gate sat red on committed code unnoticed. See AI_SLOP_AUDIT.md.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # Allow release.yml to reuse this as a pre-publish quality gate

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      # uv handles both the toolchain (Python 3.12 via uv python install)
      # and the lint tools (ruff/vulture/bandit are in the dev extra).
      # No separate actions/setup-python step needed.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync dev tools from lockfile
        # `uv sync --extra dev --frozen` installs ruff/vulture/bandit at
        # the EXACT versions pinned in uv.lock. Don't `uv pip install
        # ruff vulture bandit` — that bypasses the lockfile and fetches
        # latest from PyPI, breaking reproducibility.
        run: uv sync --extra dev --frozen

      - name: Ruff lint
        run: uv run ruff check src/oida/

      - name: Ruff format check
        run: uv run ruff format --check src/oida/

      # Strict rules (BLE001, ARG, RUF012, TRY, ...) still have thousands of
      # pre-existing violations, so they are enforced on changed files only.
      # Needs full history to diff against the base ref.
      - name: Ruff strict (changed files)
        run: |
          git fetch --no-tags --depth=50 origin "${GITHUB_BASE_REF:-main}" || true
          ./scripts/quality/lint-changed.sh "origin/${GITHUB_BASE_REF:-main}"

      # Confidence 60, not 80: at 80 vulture only sees unused variables, and
      # every dead method/class in the audit sits in the 60-79 band.
      - name: Vulture dead code (ratcheted)
        run: uv run python scripts/quality/vulture_gate.py

      - name: Cross-file structural duplication
        run: uv run python scripts/quality/structural_clones.py src/oida --baseline .quality/clones.json --fail-on-new

      - name: Low-assurance test detection
        run: uv run python scripts/quality/test_quality.py tests/ --baseline .quality/tests.json

      # B110/B112 are no longer skipped — they were the mechanism behind three
      # security checks that reported "clean" after crashing. Existing sites are
      # baselined; new ones fail.
      - name: Bandit security lint
        run: uv run bandit -r src/oida/ -c pyproject.toml -b .quality/bandit-baseline.json -q

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # python-version influences which interpreter `uv sync` picks
          # when no .python-version file matches the matrix.
          python-version: ${{ matrix.python-version }}

      - name: Sync environment from lockfile
        # `uv sync --all-extras` materializes EXACT versions from uv.lock —
        # the same set every CI run, every dev box. --frozen errors if
        # uv.lock is out of date vs pyproject.toml (caught by the
        # lockfile-drift contract test, but belt-and-braces here too).
        run: uv sync --all-extras --frozen

      - name: Unit tests
        # tests/unit/pcap/ shell out to the real tshark binary and assert on
        # its dissector output, so they are integration-grade and sensitive to
        # the runner's tshark version (CI ships 4.2.x, dev boxes run 4.6.x).
        # They are excluded from the fast/deterministic unit lane; run them in
        # an integration job with a pinned tshark instead.
        # tests/contracts/ are fast static repo-invariant guards (confirm-gate,
        # credential-leak, dead-import resolution, …) — run them here so they
        # actually gate PRs.
        run: uv run pytest tests/unit/ tests/contracts/ --ignore=tests/unit/pcap -x -q --timeout=15
