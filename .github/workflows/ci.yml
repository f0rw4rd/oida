name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # uv handles both the toolchain (Python 3.12 via uv python install)
      # and the lint tools (ruff/vulture/bandit are in the dev extra).
      # No separate actions/setup-python step needed.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install lint tools
        # `uv tool install` would also work but for one-shot CI runs
        # `uv pip install --system` is faster and avoids the tool cache.
        # Pin minor versions to match the dev extra.
        run: |
          uv python install 3.12
          uv pip install --system ruff vulture bandit

      - name: Ruff lint
        run: ruff check src/oida/

      - name: Ruff format check
        run: ruff format --check src/oida/

      - name: Vulture dead code
        run: vulture src/oida/ .vulture_whitelist.py --min-confidence 80

      - name: Bandit security lint
        run: bandit -r src/oida/ -c pyproject.toml -q

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # python-version influences which interpreter `uv sync` picks
          # when no .python-version file matches the matrix.
          python-version: ${{ matrix.python-version }}

      - name: Sync environment from lockfile
        # `uv sync --all-extras` materializes EXACT versions from uv.lock —
        # the same set every CI run, every dev box. --frozen errors if
        # uv.lock is out of date vs pyproject.toml (caught by the
        # lockfile-drift contract test, but belt-and-braces here too).
        run: uv sync --all-extras --frozen

      - name: Unit tests
        run: uv run pytest tests/unit/ -x -q --timeout=15
