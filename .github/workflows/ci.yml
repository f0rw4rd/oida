name: CI

on:
  # CI runs automatically. It was previously manual-only, and the result was
  # that it never ran at all: 628k LOC landed with no automated check, and the
  # vulture gate sat red on committed code unnoticed.
  push:
    branches: [main]
  pull_request:
  # The heavy jobs are opt-in per job, so a push to main or a PR - even a
  # README-only change - runs only lint + the fast unit/contract matrix
  # (minutes). On push/PR the `inputs` context is empty (falsy), so both skip.
  #
  # The two are gated separately on purpose:
  #   run_pcap         - pinned-tshark dissector tests, ~5 min, deterministic.
  #                      The release gate passes true.
  #   run_integration  - the ~60 min docker-mock suite. The release gate passes
  #                      FALSE: it runs locally via scripts/release_check.sh
  #                      --full before tagging, where the mock stack isn't
  #                      contended by a shared runner and a timing flake costs
  #                      a re-run of the failing tests instead of a 60-minute
  #                      job plus the whole publish pipeline behind it. Set it
  #                      true by hand (workflow_dispatch) when you do want CI
  #                      to run the mock suite.
  workflow_dispatch:
    inputs:
      run_pcap:
        description: "Run the pinned-tshark dissector job"
        type: boolean
        default: true
      run_integration:
        description: "Run the ~60 min docker-mock integration job"
        type: boolean
        default: false
  workflow_call:  # Allow release.yml to reuse this as a pre-publish quality gate
    inputs:
      run_pcap:
        description: "Run the pinned-tshark dissector job (release passes true)"
        type: boolean
        default: false
      run_integration:
        description: "Run the docker-mock integration job (release passes false - it runs locally)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      # uv handles both the toolchain (Python 3.12 via uv python install)
      # and the lint tools (ruff/vulture/bandit are in the dev extra).
      # No separate actions/setup-python step needed.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync dev tools from lockfile
        # `uv sync --extra dev --frozen` installs ruff/vulture/bandit at
        # the EXACT versions pinned in uv.lock. Don't `uv pip install
        # ruff vulture bandit` - that bypasses the lockfile and fetches
        # latest from PyPI, breaking reproducibility.
        run: uv sync --extra dev --frozen

      - name: Ruff lint
        run: uv run ruff check src/oida/

      - name: Ruff format check
        run: uv run ruff format --check src/oida/

      # Strict rules (BLE001, ARG, RUF012, TRY, ...) still have thousands of
      # pre-existing violations, so they are enforced on changed files only.
      # Needs full history to diff against the base ref.
      - name: Ruff strict (changed files)
        run: |
          git fetch --no-tags --depth=50 origin "${GITHUB_BASE_REF:-main}" || true
          ./scripts/quality/lint-changed.sh "origin/${GITHUB_BASE_REF:-main}"

      # Confidence 60, not 80: at 80 vulture only sees unused variables, and
      # every dead method/class in the audit sits in the 60-79 band.
      - name: Vulture dead code (ratcheted)
        run: uv run python scripts/quality/vulture_gate.py

      - name: Cross-file structural duplication
        run: uv run python scripts/quality/structural_clones.py src/oida --baseline .quality/clones.json --fail-on-new

      - name: Low-assurance test detection
        run: uv run python scripts/quality/test_quality.py tests/ --baseline .quality/tests.json

      # B110/B112 are no longer skipped - they were the mechanism behind three
      # security checks that reported "clean" after crashing. Existing sites are
      # baselined; new ones fail.
      - name: Bandit security lint
        run: uv run bandit -r src/oida/ -c pyproject.toml -b .quality/bandit-baseline.json -q

      # Gates only the bug-shaped mypy codes (union-attr, index, arg-type, ...)
      # against a shrinking baseline. Cosmetic codes (no-untyped-def) and the
      # dynamic-attr noise (attr-defined) are intentionally NOT gated. New
      # None/union/arg-type errors fail; fix them, don't baseline them.
      - name: Mypy bug-shaped types (ratcheted)
        run: uv run python scripts/quality/mypy_gate.py

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full unit suite is ~13k pure-Python tests that behave identically
        # on every interpreter; running all of it on all five versions was five
        # copies of the same result and the slowest thing in CI. Instead: one
        # CANONICAL lane runs everything, and every other version runs a curated
        # cross-version SUBSET - the `-m version_sensitive` tests (packaging/
        # metadata, stdlib API, asyncio/mock timing), the import-smoke that
        # imports every oida module (catches syntax/stdlib breaks on new/old
        # Pythons), and the repo-invariant contracts. Anything genuinely
        # version-dependent MUST carry the `version_sensitive` marker to be
        # exercised off the canonical lane - see pyproject.toml.
        #
        # `extras` selects which optional-dependency groups uv installs. Every
        # lane wants them all EXCEPT 3.14, where the dnp3 extra's yadnp3 has no
        # cp314 wheel yet and its sdist build is broken upstream. `--all-extras`
        # alone won't drop it (the `all` meta-extra re-pulls it), so 3.14 uses
        # `--no-extra all --no-extra dnp3` to install every other protocol on
        # 3.14 while skipping only DNP3. Drop this special-case once yadnp3
        # ships a cp314 wheel.
        include:
          - python-version: "3.13"  # canonical: whole suite runs here
            scope: full
            extras: "--all-extras"
          - python-version: "3.10"
            scope: subset
            extras: "--all-extras"
          - python-version: "3.11"
            scope: subset
            extras: "--all-extras"
          - python-version: "3.12"
            scope: subset
            extras: "--all-extras"
          - python-version: "3.14"
            scope: subset
            extras: "--all-extras --no-extra all --no-extra dnp3"
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # python-version influences which interpreter `uv sync` picks
          # when no .python-version file matches the matrix.
          python-version: ${{ matrix.python-version }}

      - name: Sync environment from lockfile
        # `uv sync <extras>` materializes EXACT versions from uv.lock - the same
        # set every CI run, every dev box. --frozen errors if uv.lock is out of
        # date vs pyproject.toml (caught by the lockfile-drift contract test, but
        # belt-and-braces here too). matrix.extras is --all-extras everywhere
        # except 3.14 (see the matrix comment: yadnp3/dnp3 has no cp314 wheel).
        run: uv sync ${{ matrix.extras }} --frozen

      - name: Full unit & contract suite (canonical Python)
        if: matrix.scope == 'full'
        # tests/unit/pcap/ and tests/unit/fuzz/test_tshark_validation.py shell
        # out to the real tshark binary and assert on its dissector output, so
        # they are integration-grade and sensitive to the runner's tshark
        # version (CI ships 4.2.x, dev boxes run 4.6.x). They are excluded from
        # the fast/deterministic unit lane - which has no tshark at all, and
        # tests/service_gate.py turns a missing dependency into a hard failure
        # rather than a skip - and run in the `pcap` job with a pinned tshark.
        # tests/contracts/ are fast static repo-invariant guards (confirm-gate,
        # credential-leak, dead-import resolution, ...) - run them here so they
        # actually gate PRs. -n auto --dist worksteal parallelises across cores.
        run: >-
          uv run pytest tests/unit/ tests/contracts/
          --ignore=tests/unit/pcap
          --ignore=tests/unit/fuzz/test_tshark_validation.py
          -n auto --dist worksteal -q --timeout=15

      - name: Cross-version subset (non-canonical Python)
        if: matrix.scope == 'subset'
        # Two invocations because contracts are unmarked repo-invariants (run
        # them wholesale) while the unit lane is filtered to -m version_sensitive
        # so only interpreter-divergent behaviour + import-smoke run here. bash
        # -e (GitHub default) fails the job if either call fails.
        #
        # --ignore=tests/unit/dnp3: those modules do `opendnp3 = require_import(
        # "opendnp3")` at import time, which HARD-FAILS at collection (service_gate
        # is strict) on any lane where the dnp3 extra can't install - notably 3.14,
        # whose only gap is yadnp3 having no cp314 wheel. The dnp3 tests aren't
        # version_sensitive so nothing is deselected by skipping them; the canonical
        # `full` lane (opendnp3 present) still runs them.
        run: |
          uv run pytest tests/contracts/ -q --timeout=15
          uv run pytest tests/unit/ -m version_sensitive \
            --ignore=tests/unit/pcap \
            --ignore=tests/unit/fuzz/test_tshark_validation.py \
            --ignore=tests/unit/dnp3 \
            -n auto --dist worksteal -q --timeout=15

  pcap:
    name: Dissector tests (pinned tshark)
    # Runs on release (workflow_call passes run_pcap: true) and on manual
    # dispatch. Skipped on push/PR, where the inputs context is empty.
    if: ${{ inputs.run_pcap }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false
          lfs: true

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync environment from lockfile
        run: uv sync --all-extras --frozen

      # The job the `test` step's comment has been promising: tests/unit/pcap
      # and the fuzzer's baseline-payload dissector check assert on real tshark
      # dissector output, so they need a tshark whose version is known rather
      # than whatever the runner image happens to ship.
      - name: Install tshark
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1

      - name: Dissector tests
        run: >-
          uv run pytest tests/unit/pcap tests/unit/fuzz/test_tshark_validation.py
          -q --timeout=60

  integration:
    name: Integration (docker mocks)
    # Off by default everywhere, including the release gate. This suite drives
    # ~67 shared mock containers and is timing-sensitive; on a contended hosted
    # runner an unrelated flake failed the whole release pipeline and the only
    # retry was another 60-minute job. It now runs locally before tagging
    # (scripts/release_check.sh --full), where a flake is re-run in seconds.
    # Flip run_integration on via workflow_dispatch to run it here anyway.
    if: ${{ inputs.run_integration }}
    runs-on: ubuntu-latest
    # 5,448 tests that ran in no workflow before this job existed - the mock
    # stack makes them too heavy for the unit lane but they are the only
    # coverage the protocol scanners get against real servers.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          persist-credentials: false
          lfs: true

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Sync environment from lockfile
        run: uv sync --all-extras --frozen

      - name: Bring up the core mock stack
        run: uv run python services.py up core --quiet-pull

      # Same topology as scripts/run-all-tests.sh: --dist loadgroup keeps each
      # xdist_group (one per shared mock) pinned to a single worker. Workers are
      # half the runner's cores, clamped to [2, 4]: each integration test spawns
      # an oida subprocess (~2 cores) and shares the one mock stack, so a
      # worker-per-core run oversubscribes the box and makes timing-sensitive
      # scans miss their timeouts and flake. The upper cap holds regardless of
      # core count because the shared mock stack - not the CPU - is the limit,
      # so a bigger runner must not push more workers at it.
      - name: Integration tests
        run: |
          workers=$(( $(nproc) / 2 ))
          [ "$workers" -lt 2 ] && workers=2
          [ "$workers" -gt 4 ] && workers=4
          echo "Running integration tests with -n $workers on $(nproc) cores"
          uv run pytest tests/integration -p no:randomly -n "$workers" --dist loadgroup

      # `services.py logs` follows and would hang the job, so report status only.
      - name: Mock status on failure
        if: failure()
        run: uv run python services.py status || true

      - name: Tear down mocks
        if: always()
        run: uv run python services.py down || true
