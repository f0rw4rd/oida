# Minimal snmpd.conf for CVE-2019-20892 repro (net-snmp 5.8)
# createUser is consumed on first start and migrated to the persistent conf;
# after that authPrivUser (SHA auth / AES priv) is usable for SNMPv3 authPriv.
createUser authPrivUser SHA "authpassword123" AES "privpassword123"
rwuser authPrivUser
rouser authPrivUser
rocommunity public
agentAddress udp:161

# Keep startup quiet/minimal.
sysLocation lab
sysContact root@localhost
