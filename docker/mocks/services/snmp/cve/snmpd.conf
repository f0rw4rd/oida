# Minimal snmpd.conf for CVE-2018-18066 repro (net-snmp 5.7.3)
rocommunity public
rwcommunity private
# NOTE: no agentAddress here on purpose. The listen endpoint is passed on the
# snmpd command line (udp:1161). Declaring it in BOTH places makes snmpd try to
# bind the same port twice -> the second open fails ("Error opening endpoint").
# A high port is used because binding privileged 161 fails under this Docker
# runtime; the CVE parse path is port-independent.

# v3 user so the SNMPv3 PoC packet reaches the parse path.
createUser authPrivUser SHA "myauthkey1234" AES "myprivkey1234"
rouser authPrivUser

# Keep startup quiet/minimal.
sysLocation lab
sysContact root@localhost
