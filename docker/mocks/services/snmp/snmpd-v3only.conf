# OIDA SNMP Mock Service — SNMPv3-Only Hardened Profile
# No v1/v2c communities. All access requires SNMPv3 authentication.
# Simulates a hardened ICS gateway that has disabled legacy SNMP.

agentaddress udp:161

# =============================================================================
# System info
# =============================================================================
sysDescr    Schweitzer SEL-3620 Ethernet Security Gateway, Firmware 3.0.0.1
override .1.3.6.1.2.1.1.2.0 object_id .1.3.6.1.4.1.3535.1.1.3620
override -rw .1.3.6.1.2.1.1.4.0 octet_str "security@substation.local"
sysLocation Substation 42, Control House
sysName     SEL-3620-GW01
sysServices 72

# =============================================================================
# NO v1/v2c communities — all disabled
# =============================================================================

# =============================================================================
# Views — restrict access to standard MIB subtrees only
# =============================================================================
# system view: MIB-2 system, interfaces, ip, tcp, udp, host-resources, snmpFramework
view  system   included  .1.3.6.1.2.1.1
view  system   included  .1.3.6.1.2.1.2
view  system   included  .1.3.6.1.2.1.4
view  system   included  .1.3.6.1.2.1.6
view  system   included  .1.3.6.1.2.1.7
view  system   included  .1.3.6.1.2.1.25
view  system   included  .1.3.6.1.6.3
view  all      included  .1

# =============================================================================
# VACM — SNMPv3 groups with restricted access
# =============================================================================
# Read-only group: can see 'system' view only
# Read-write group: can see 'all' view
group  v3readonly  usm  engineer
group  v3readonly  usm  monitor
group  v3readonly  usm  operator
group  v3admin     usm  admin

# group            context  secmodel  seclevel  match  readview  writeview  notifyview
access  v3readonly  ""       usm       auth      exact  system    none       none
access  v3admin     ""       usm       priv      exact  all       all        none

# =============================================================================
# SNMPv3 Users — created via createUser in entrypoint.sh
#
# Minimum security level: authNoPriv (no noauth users!)
#   engineer  — authNoPriv, SHA, pass=engineer1        (read-only, system view)
#   monitor   — authPriv, MD5+DES, auth=monitor1       (read-only, system view)
#   operator  — authPriv, SHA-256+AES-256, auth=operator1 (read-only, system view)
#   admin     — authPriv, SHA+AES128, auth=admin123    (read-write, full view)
# =============================================================================
