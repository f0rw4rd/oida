# OIDA SNMP Mock Service — Windows ICS Workstation Profile
# Simulates a Windows ICS workstation with LanManager MIB (PEN 77)
# for user, share, service, and domain enumeration.

agentaddress udp:161

# =============================================================================
# System info — Windows-style sysDescr
# =============================================================================
sysDescr    Hardware: Intel64 Family 6 Model 158 Stepping 13 - Software: Windows Version 10.0 (Build 19045 Multiprocessor Free)
override -rw .1.3.6.1.2.1.1.4.0 octet_str "ics-admin@plant.local"
sysLocation ICS Control Room, Building A
sysName     SCADA-WS01
sysServices 72

# =============================================================================
# SNMPv1/v2c Community Strings
# =============================================================================
rocommunity  public  default
rwcommunity  private default
rocommunity  SCADA   default
rocommunity  monitor default

# =============================================================================
# View and VACM configuration
# =============================================================================
view  all    included  .1
access notConfigGroup ""  any  noauth  exact  all  all  none

# =============================================================================
# SNMPv3 Users
# Standard: initial, engineer, readonly, admin, monitor, service
# Non-default ciphers: operator (SHA-256+AES-256), backup (SHA-512+AES-192)
# =============================================================================
rouser initial noauth
rouser engineer auth
rouser readonly auth
rwuser admin priv
rouser monitor priv
rouser service priv
rouser operator priv
rouser backup priv

# =============================================================================
# LanManager enterprise OIDs via pass_persist
# Serves: svUserName, svShareName/Path/Comment, svSvcName/State, domPrimaryDomain
# =============================================================================
pass_persist .1.3.6.1.4.1.77 /usr/local/bin/pass_persist.py --subtree lanmanager
