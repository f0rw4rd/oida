# OIDA SNMP Mock Service — H3C Managed Switch Profile
# Simulates an H3C S5500 switch with credential tables (PEN 2011 + 25506)
# and bridge MAC/FDB forwarding database.

agentaddress udp:161

# =============================================================================
# System info — H3C switch identity
# =============================================================================
sysDescr    H3C S5500-28C-EI Comware Platform Software Version 5.20.99, Release 2220P10
override .1.3.6.1.2.1.1.2.0 object_id .1.3.6.1.4.1.25506.11.1.107
override -rw .1.3.6.1.2.1.1.4.0 octet_str "netadmin@ics-plant.local"
sysLocation Server Room, Rack 3
sysName     ICS-SWITCH-01
sysServices 6

# =============================================================================
# SNMPv1/v2c Community Strings
# =============================================================================
rocommunity  public  default
rwcommunity  private default
rocommunity  SCADA   default

# =============================================================================
# View configuration
# =============================================================================
view  all    included  .1

# =============================================================================
# SNMPv3 Users
# Standard: initial, admin
# Non-default ciphers: operator (SHA-256+AES-256), backup (SHA-512+AES-192)
# =============================================================================
rouser initial noauth
rwuser admin priv
rouser operator priv
rouser backup priv

# =============================================================================
# H3C credential tables via pass_persist
# PEN 2011 (legacy Huawei/H3C) and PEN 25506 (H3C post-split)
# Serves: h3c/hh3cUserName, Password, Level, State
# =============================================================================
pass_persist .1.3.6.1.4.1.2011  /usr/local/bin/pass_persist.py --subtree h3c
pass_persist .1.3.6.1.4.1.25506 /usr/local/bin/pass_persist.py --subtree h3c-new

# =============================================================================
# Brocade ADX credential tables via pass_persist (P2 addition)
# PEN 1991 — Serves: brocadeAdxAdminUser, brocadeAdxAdminPassword
# =============================================================================
pass_persist .1.3.6.1.4.1.1991 /usr/local/bin/pass_persist.py --subtree brocade

# =============================================================================
# Bridge MIB (MAC/FDB forwarding database) via pass_persist
# Serves: dot1dTpFdbAddress, dot1dTpFdbPort, dot1dTpFdbStatus
# =============================================================================
pass_persist .1.3.6.1.2.1.17 /usr/local/bin/pass_persist.py --subtree bridge
