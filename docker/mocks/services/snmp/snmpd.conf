# OIDA SNMP Mock Service — Linux ICS Server Profile
# Configured with multiple v2c communities, v3 users (incl. non-default ciphers),
# trap targets, VACM write detection, and full HOST-RESOURCES-MIB.

# Listen on all interfaces
agentaddress udp:161

# =============================================================================
# System info
# Using 'override' for sysContact so it's writable via SNMP SET (for --test-write)
# =============================================================================
sysDescr    Linux ics-server01 5.15.0-91-generic #101-Ubuntu SMP x86_64
override -rw .1.3.6.1.2.1.1.4.0 octet_str "ics-admin@plant.local"
sysLocation ICS Control Room, Building A
sysName     ics-server01
sysServices 72

# =============================================================================
# SNMPv1/v2c Community Strings
# =============================================================================
# "public" — read-only (default, should be discoverable)
rocommunity  public  default
# "private" — read-write (common ICS misconfiguration)
rwcommunity  private default
# "SCADA" — read-only (ICS-specific default)
rocommunity  SCADA   default
# "monitor" — read-only
rocommunity  monitor default

# =============================================================================
# View and VACM configuration
# =============================================================================
view  all    included  .1

# VACM access entry — makes vacmAccessTable walkable for _vacm_check()
# notConfigGroup is auto-created by rocommunity/rwcommunity directives
access notConfigGroup ""  any  noauth  exact  all  all  none

# =============================================================================
# SNMPv3 Users — created via createUser in /var/lib/snmp/snmpd.conf
#
# Standard ciphers:
#   initial   — noAuthNoPriv (no password)
#   engineer  — authNoPriv, SHA, pass=engineer1
#   readonly  — authNoPriv, MD5, pass=readonly1
#   admin     — authPriv, SHA + AES128, auth=admin123, priv=admin123
#   monitor   — authPriv, MD5 + DES, auth=monitor1, priv=monitor1
#   service   — authPriv, SHA + AES128, auth=service1, priv=service1
#
# Non-default ciphers:
#   operator  — authPriv, SHA-256 + AES-256, auth=operator1, priv=operator1
#   backup    — authPriv, SHA-512 + AES-192, auth=backup12, priv=backup12
# =============================================================================

# noAuthNoPriv user — full access without any authentication
rouser initial noauth

# authNoPriv users — require authentication only
rouser engineer auth
rouser readonly auth

# authPriv users — require both authentication and privacy
rwuser admin priv
rouser monitor priv
rouser service priv
rouser operator priv
rouser backup priv

# =============================================================================
# Trap configuration (for _enum_trap_config)
# =============================================================================
trap2sink 192.168.1.200:162 internal
informsink 192.168.1.201:162 public

# =============================================================================
# NET-SNMP Extend Scripts (for --enum extend detection)
# =============================================================================
# Permanent config-based script (storage=permanent) — typical RCE vector
extend check-ics /bin/sh -c "echo ICS_STATUS=OK; uptime"
# Second extend for coverage
extend disk-check /usr/bin/df -h

# =============================================================================
# Overrides for security finding triggers
# =============================================================================
# IP forwarding enabled — triggers security finding in _enum_system_details
override .1.3.6.1.2.1.4.1.0 integer 1
