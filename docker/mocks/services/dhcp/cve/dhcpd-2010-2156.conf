# Minimal dhcpd.conf for reproducing CVE-2010-2156 (ISC DHCP 4.1.1, pre-P1).
#
# The entrypoint gives interface dhcp0 the address 10.99.0.1/24, then starts
# dhcpd bound to dhcp0. dhcpd requires a subnet declaration matching every
# interface it listens on, so we declare 10.99.0.0/24 below. authoritative;
# lets dhcpd answer/process DISCOVERs. The vulnerable code path
# (find_lease -> find_lease_by_uid -> hash_lookup -> find_length -> log_fatal)
# is reached while parsing the inbound packet's option 61, independent of
# whether a lease is actually offered, so a trivial range is enough.

authoritative;

# Keep logs on stderr (entrypoint runs dhcpd -d) and lease churn minimal.
default-lease-time 600;
max-lease-time 7200;

# Lease database lives here; the dir/file are created in the image + entrypoint.
# (path is the compile-time default /var/lib/dhcp/dhcpd.leases on this build)

subnet 10.99.0.0 netmask 255.255.255.0 {
    range 10.99.0.100 10.99.0.200;
    option routers 10.99.0.1;
    option subnet-mask 255.255.255.0;
}
