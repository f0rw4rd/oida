# Minimal dnsmasq.conf to drive CVE-2017-14493 (DHCPv6 server path, UDP 547).
#
# Goal: get dnsmasq to bind UDP 547 and reach dhcp6_packet -> dhcp6_maybe_relay
# so an inbound DHCP6RELAYFORW with an oversized Option 79 overflows state->mac.

# Disable the DNS listener entirely (no port 53 noise; we only need DHCPv6).
port=0

# Bind only to the interfaces we name, and only those (no wildcard bind). The
# container CMD adds an IPv6 address to lo, so DHCPv6 binds on loopback.
interface=lo
bind-interfaces

# A DHCPv6 range is required for dnsmasq to start its DHCPv6 server and listen
# on UDP 547. The actual addresses are irrelevant to the overflow: the crash is
# in option parsing, which runs before any allocation logic.
dhcp-range=::1,::ff,constructor:lo,12h

# Router-advertisement / DHCPv6 stateful: ensures the DHCPv6 socket is opened.
enable-ra

# Keep startup quiet of system-bus / leasefile permission issues in-container.
dhcp-leasefile=/tmp/dnsmasq.leases
