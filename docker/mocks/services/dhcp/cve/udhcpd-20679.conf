# Minimal BusyBox udhcpd config for CVE-2018-20679 (BusyBox 1.29.3).
#
# NOTE: the shipped container uses Approach B — a harness that links the GENUINE
# vulnerable udhcp_get_option() from BusyBox networking/udhcp/common.c and feeds
# it received packets behind a moving ASan fence. That harness binds UDP 67
# directly and does NOT read this file.
#
# This config is kept for documentation / Approach-A reproducibility: it is a
# valid `busybox udhcpd -f <thisfile>` configuration for the same 1.29.3 tree,
# showing the server-reachable DHCPv4 entry point on UDP 67. The
# udhcp_get_option() over-read is exercised by udhcpd while parsing every
# inbound client request, independent of these lease parameters.

start           192.168.222.20
end             192.168.222.200
interface       lo
lease_file      /tmp/udhcpd-20679.leases
pidfile         /tmp/udhcpd-20679.pid
option subnet   255.255.255.0
option router   192.168.222.1
option dns      192.168.222.1
option lease    3600
