# Minimal ntpd config for CVE-2015-7855 reproduction.
#
# CVE-2015-7855: decodenetnum() reachable assertion (CWE-617) -> abort().
# A mode 6 (ntpq) or mode 7 (ntpdc) control packet carrying an over-long
# address string flows into decodenetnum(), whose length handling trips an
# ISC INSIST/assertion and calls abort().
#
# mode 7 is disabled by default in 4.2.8, so we explicitly enable it to reach
# the mode-7 (ntpdc) decode path. mode 6 (ntpq) is always processed.
driftfile /tmp/ntp.drift

# Enable the legacy mode-7 (ntpdc) request handler so the long-data value can
# reach decodenetnum().
enable mode7

# Be permissive so the control packet is not dropped at an ACL stage before it
# reaches the decode path. Allow localhost (the PoC source) to query freely.
restrict default
restrict -6 default
restrict 127.0.0.1
restrict -6 ::1
