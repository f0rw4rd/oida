# Minimal ntpd config for CVE-2014-9295 (crypto_recv / crypto_verify) repro.
#
# The reachable pre-auth path for the crypto_recv() / crypto_verify() stack &
# OOB-read overflows is the Autokey BROADCAST-client path: a spoofed broadcast
# NTP packet carrying a crypto extension field auto-mobilizes a peer and is fed
# straight into crypto_recv() (ntp_proto.c receive(), AM_NEWBCL -> line ~919).
#
# Requirements for that path:
#   * crypto (Autokey) enabled            -> `crypto` line below
#   * broadcastclient enabled             -> `broadcastclient`
#   * authentication not mandatory so a spoofed packet is accepted
#                                          -> `disable auth`
#   * broadcastdelay 0 so the calibration volley runs crypto_recv immediately
driftfile /tmp/ntp.drift

# Turn the Autokey/crypto machinery on (sets crypto_flags so the skeyid>NTP_MAXKEY
# autokey branch in receive() is taken).
crypto pw oidatest
keysdir /app/keys

broadcastclient
broadcastdelay 0.0

# Do not require authentication: lets spoofed/unauthenticated packets through
# the AUTH() gate so they reach crypto_recv().
disable auth

restrict default
restrict -6 default
restrict 127.0.0.1
restrict -6 ::1
