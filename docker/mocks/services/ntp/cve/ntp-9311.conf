# ntp.conf for CVE-2016-9311 (report_event NULL pointer dereference) repro.
#
# CVE-2016-9311 only fires when the TRAP SERVICE is enabled, i.e. when
# num_ctl_traps > 0 in ntpd/ntp_control.c -- otherwise report_event() returns
# early at `if (num_ctl_traps <= 0) return;` before reaching the NULL deref.
#
# We enable the trap TWO ways so the precondition is live regardless of how the
# PoC drives it:
#   1. A static `trap` directive below -> a configured trap (TRAP_CONFIGURED)
#      is present from boot, so num_ctl_traps > 0 immediately.
#   2. The mode-6 CTL_OP_SETTRAP control op is NOAUTH in p8, so the PoC can also
#      register a runtime trap with an unauthenticated control packet.
#
# Mitigation per the upstream advisory is `restrict default noquery`, so we do
# the OPPOSITE: leave mode-6 control queries (incl. SETTRAP) allowed.

driftfile /tmp/ntp.drift

# Permissive default so crafted mode-6 control packets (SETTRAP, async event
# subscription) are accepted. No `noquery`/`notrap` that would block them.
restrict default
restrict -6 default
restrict 127.0.0.1
restrict ::1

# Enable the trap service: send async control event notifications to this
# address. This makes num_ctl_traps > 0 from startup so report_event() does NOT
# short-circuit, and a NULL-peer PEER_EVENT can reach the dereference.
trap 127.0.0.1 port 12397

# A local clock so the server comes fully up and the control dispatch is
# deterministic.
server 127.127.1.0
fudge  127.127.1.0 stratum 10
