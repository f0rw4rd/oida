# Minimal ntp.conf for CVE-2016-7434 (read_mru_list NULL deref) repro.
#
# CVE-2016-7434 is a MODE 6 (ntpq control) bug: CTL_OP_READ_MRU is dispatched
# from control_codes[] with the NOAUTH flag, so it is reachable WITHOUT
# authentication and WITHOUT `enable mode7` (mode 7 / ntpdc is unrelated here).
#
# The only thing the default restrict policy must NOT do is set the
# `nomrulist` flag, which would make read_mru_list() bail out early
# (RES_NOMRULIST) before reaching the vulnerable variable-decode loop.
# We therefore leave mrulist allowed for localhost.

driftfile /tmp/ntp.drift

# Permissive default so the crafted mrulist control query reaches
# read_mru_list().  No `nomodify`/`noquery`/`nomrulist` that would block it.
restrict default
restrict -6 default
restrict 127.0.0.1
restrict ::1

# A local clock-ish source isn't required to reach the control path, but
# having the server fully up makes the mode-6 dispatch deterministic.
server 127.127.1.0
fudge  127.127.1.0 stratum 10
