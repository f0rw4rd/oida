# dnsmasq 2.77 DHCPv6 config for CVE-2017-14493 (stack overflow in dhcp6_maybe_relay)
#
# We only need the DHCPv6 server side reachable so a RELAY-FORW packet hits
# dhcp6_maybe_relay() in src/rfc3315.c. A stateful dhcp-range bound to a single
# interface is the minimal config that makes daemon->doing_dhcp6 true and gives
# the receiving interface a matching DHCPv6 context.
#
# The Docker default bridge has IPv6 disabled on eth0, but loopback always
# carries ::1, so we serve DHCPv6 on lo. The overflow in dhcp6_maybe_relay runs
# during option parsing, independent of which interface the packet arrived on.

# Don't touch DNS upstreams / /etc/resolv.conf - this box is DHCP-only here.
no-resolv
no-hosts

# Serve only on loopback; bind explicitly so we own :547 there.
interface=lo
bind-interfaces

# Stateful DHCPv6 range on lo -> doing_dhcp6 = 1 and a context exists for lo.
dhcp-range=::10,::400,constructor:lo,64,12h

# Keep everything in the foreground log (start script adds -d -q).
log-facility=-
log-dhcp
