# dnsmasq 2.77 forwarder config for CVE-2017-14491 (ASan build)
# Forwards every query to the in-container malicious upstream, which replies
# with the oversized/compression-pointer payload that overflows the answer buf.
port=53
listen-address=0.0.0.0
bind-interfaces
no-resolv
no-hosts
server=127.0.0.1#5399
cache-size=1000
# Shrink the answer buffer (edns_pktsz + MAXDNAME + RRFIXEDSZ) so the long-name
# CNAME chain served from cache walks the write pointer past the buffer end.
edns-packet-max=512
log-queries
log-facility=-
