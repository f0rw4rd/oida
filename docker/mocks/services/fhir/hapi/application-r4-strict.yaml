# HAPI FHIR JPA Server Starter - R4 strict / validating config
#
# Upstream: https://github.com/hapifhir/hapi-fhir-jpaserver-starter
# License:  Apache-2.0 (official image hapiproject/hapi, nothing vendored here)
#
# Genuine HAPI FHIR JPA server (R4) with server-side validation turned ON for
# both requests and responses, external references blocked, and the set of
# accepted bundle types restricted. Non-conformant resources are rejected with
# an OperationOutcome instead of being stored - the opposite posture to the
# permissive R4 service. Layered via spring.config.additional-location
# (overrides only the keys below; inherits the bundled embedded-H2 datasource
# and bean wiring). Embedded H2, no external DB.
hapi:
  fhir:
    fhir_version: R4
    server_address: http://localhost:8092/fhir
    # Strict posture.
    validation:
      requests_enabled: true
      responses_enabled: true
    allow_external_references: false
    allow_multiple_delete: false
    allow_placeholder_references: false
    allowed_bundle_types: COLLECTION,DOCUMENT,MESSAGE,TRANSACTION,TRANSACTIONRESPONSE,BATCH,BATCHRESPONSE,HISTORY,SEARCHSET
    cors:
      allow_Credentials: false
      allowed_origin:
        - '*'
    tester:
      home:
        name: OIDA HAPI FHIR R4 (strict/validating)
        server_address: http://localhost:8092/fhir
        refuse_to_fetch_third_party_urls: true
        fhir_version: R4
