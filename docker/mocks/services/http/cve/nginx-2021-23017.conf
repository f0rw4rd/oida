# nginx config for CVE-2021-23017 (resolver off-by-one heap write)
# The bug only triggers when the `resolver` directive is configured AND the
# attacker can forge DNS responses. We point the resolver at 127.0.0.1:5353
# where our malicious DNS server (served by the PoC) answers.
daemon off;
master_process off;
worker_processes 1;
error_log /dev/stdout info;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Attacker-controlled DNS. ngx_resolver_copy() parses the response name and
    # commits the off-by-one heap write while decompressing the crafted name.
    resolver 127.0.0.1:5353 valid=1s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;

        # Force a runtime DNS lookup through the vulnerable resolver. Any
        # request to this location makes nginx resolve the upstream name via
        # the malicious DNS server.
        location / {
            set $backend "trigger.example.com";
            proxy_pass http://$backend;
        }
    }
}
