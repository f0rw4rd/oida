# nginx config for CVE-2013-2028 (chunked Transfer-Encoding stack overflow)
# Foregrounded so AddressSanitizer output reaches `docker logs`.
daemon off;
master_process off;          # single process: ASan abort kills the container
worker_processes 1;
error_log /dev/stdout info;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server {
        listen 80;
        server_name _;

        # The bug is in discarded-request-body chunk parsing. A request to a
        # location that ignores the body (e.g. a static 405/404 path, or any
        # handler that discards the body) reaches ngx_http_parse_chunked.
        location / {
            return 200 "ok\n";
        }
    }
}
