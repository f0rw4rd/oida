# nginx config for CVE-2017-7529 (range filter integer overflow)
daemon off;
master_process off;
worker_processes 1;
error_log /dev/stdout info;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # max_ranges default; the range filter is active for static files. A static
    # file of known size lets the crafted Range header overflow the offset math.
    server {
        listen 80;
        server_name _;

        location / {
            root /usr/local/nginx/html;
            index index.html;
        }
    }
}
