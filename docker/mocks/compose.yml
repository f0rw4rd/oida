      oida.group: "hart"
      oida.description: "HART-IP primary master, UDP + TCP, universal commands, no auth"
      oida.ports: "5094/udp, 5094/tcp"

  # FieldComm hipserver + hipflowapp, compiled HART 5 (universal rev 5, short
  # Cmd 0 identity, tag FLOW5DEV). Built from source, no committed binaries.
  hart-hipflow-hart5:
    build:
      context: ./services/hart/mock
      dockerfile: Dockerfile.hart-hipflow
