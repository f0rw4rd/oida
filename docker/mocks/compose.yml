# Core ICS + Network Mock Services
# Start with: just up (or docker compose -f compose.yml up -d)

services:
  modbus-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.modbus
    container_name: modbus-mock-server
    hostname: modbus-server
    ports:
      - "502:502"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 502), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "modbus"
      oida.description: "Modbus TCP server, unit IDs 1-10, coils/registers/input, no auth"
      oida.ports: "502"

  modbus-tls:
    build:
      context: ./services
      dockerfile: Dockerfile.modbus-tls
    container_name: modbus-tls-server
    hostname: modbus-tls
    ports:
      - "802:802"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - MODBUS_TLS_PORT=802
      - MODBUS_MTLS=1
    volumes:
      - ./certs/ca.pem:/certs/ca.pem:ro
      - ./certs/modbus-tls/server.pem:/certs/server.pem:ro
      - ./certs/modbus-tls/server.key:/certs/server.key:ro
      - ./certs/client.pem:/certs/client.pem:ro
      - ./certs/client.key:/certs/client.key:ro
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 802), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "modbus"
      oida.description: "Modbus TLS with mTLS client auth"
      oida.ports: "802"

  modbus-rtu-tcp:
    build:
      context: ./services
      dockerfile: Dockerfile.modbus-rtu-tcp
    container_name: modbus-rtu-tcp-server
    hostname: modbus-rtu-tcp
    ports:
      - "5030:5030"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - MODBUS_RTU_TCP_PORT=5030
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 5030), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "modbus"
      oida.description: "Modbus RTU-over-TCP gateway (3 slave units)"
      oida.ports: "5030"

  # Conpot Modbus TCP Honeypot (Honeynet Project)
  modbus-conpot:
    build:
      context: ./services/conpot-modbus
      dockerfile: Dockerfile
    container_name: modbus-conpot-server
    hostname: modbus-conpot
    ports:
      - "5503:5020"
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 5020), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.protocol: "modbus"
      oida.group: "modbus"
      oida.description: "Conpot Modbus TCP honeypot, Schneider M340 sim, FC 1-4 + MEI device ID"
      oida.ports: "5503"

  opcua-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.opcua
    container_name: opcua-mock-server
    hostname: opcua-server
    ports:
      - "4840:4840"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 4840), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "opcua"
      oida.description: "OPC UA server, anonymous access, no encryption, standard namespace"
      oida.ports: "4840"

  ads-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.ads
    container_name: ads-mock-server
    hostname: ads-server
    ports:
      - "48898:48898"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 48898), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "ads"
      oida.description: "Beckhoff ADS/TwinCAT simulator, AMS router, no auth"
      oida.ports: "48898"

  ethernetip-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.ethernetip
    container_name: ethernetip-mock-server
    hostname: ethernetip-server
    ports:
      - "44818:44818"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 44818), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "ethernetip"
      oida.description: "EtherNet/IP CIP server, identity + ListServices, no auth"
      oida.ports: "44818"

  bacnet-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.bacnet
    container_name: bacnet-mock-server
    hostname: bacnet-server
    ports:
      - "47808:47808/udp"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x81\\x0a\\x00\\x04', ('localhost', 47808)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "bacnet"
      oida.description: "BACnet/IP server, device 1234, analog/binary/multi-state objects, no auth"
      oida.ports: "47808/udp"

  # Conpot BACnet/IP Honeypot (Honeynet Project)
  bacnet-conpot:
    build:
      context: ./services/conpot-bacnet
      dockerfile: Dockerfile
    container_name: bacnet-conpot-server
    hostname: bacnet-conpot
    ports:
      - "47812:47808/udp"
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x81\\x0a\\x00\\x04', ('localhost', 47808)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.protocol: "bacnet"
      oida.group: "bacnet"
      oida.description: "Conpot BACnet/IP honeypot, Alerton VAV-DD controller sim, device 36113, WhoIs/ReadProperty"
      oida.ports: "47812/udp"

  # ============================================================================
  # CoAP Mock Server
  # ============================================================================
  coap-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.coap
    container_name: coap-mock-server
    hostname: coap-server
    ports:
      - "5683:5683/udp"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x40\\x01\\x00\\x01', ('localhost', 5683)); data=s.recv(64); s.close(); assert len(data)>0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "coap"
      oida.description: "CoAP server (aiocoap), /.well-known/core, LwM2M /3/0 device object, observable sensors, writable actuators, NoSec mode"
      oida.ports: "5683/udp"

  coap-libcoap:
    build:
      context: ./services
      dockerfile: Dockerfile.coap-libcoap
    container_name: coap-libcoap-server
    hostname: coap-libcoap
    ports:
      - "5685:5685/udp"
    environment:
      - TZ=UTC
      - COAP_PORT=5685
      - COAP_VERBOSITY=5
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x40\\x01\\x00\\x01', ('localhost', 5685)); data=s.recv(64); s.close(); assert len(data)>0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.group: "coap"
      oida.description: "CoAP server (libcoap/C), interop testing, dynamic resources, no auth"
      oida.ports: "5685/udp"

  coap-dtls:
    build:
      context: ./services
      dockerfile: Dockerfile.coap-libcoap
    container_name: coap-dtls-server
    hostname: coap-dtls
    ports:
      - "5684:5684/udp"
    environment:
      - TZ=UTC
      - COAP_PORT=5683
      - COAP_PSK_KEY=secretPSK123
      - COAP_PSK_HINT=oida-client
      - COAP_VERBOSITY=5
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x40\\x01\\x00\\x01', ('localhost', 5683)); data=s.recv(64); s.close(); assert len(data)>0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.group: "coap"
      oida.description: "CoAP server (libcoap/C) with DTLS-PSK encryption, PSK=secretPSK123, hint=oida-client"
      oida.ports: "5684/udp"

  coap-dtls-cert:
    build:
      context: ./services
      dockerfile: Dockerfile.coap-dtls-cert
    container_name: coap-dtls-cert-server
    hostname: coap-dtls-cert
    ports:
      - "5686:5684/udp"
    environment:
      - TZ=UTC
      - COAP_PORT=5683
      - COAP_VERBOSITY=5
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x40\\x01\\x00\\x01', ('localhost', 5683)); data=s.recv(64); s.close(); assert len(data)>0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.group: "coap"
      oida.description: "CoAP server (libcoap/C) with DTLS certificate auth, certs in /app/certs/"
      oida.ports: "5686/udp"

  # ============================================================================
  # MMS / IEC 61850
  # ============================================================================

  mms-libiec61850:
    build:
      context: ./services
      dockerfile: Dockerfile.mms
    image: mms-libiec61850
    container_name: mms-libiec61850-server
    hostname: mms-server
    ports:
      - "102:102"       # MMS/IEC 61850 (libiec61850-based)
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/102"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.group: "mms"
      oida.description: "MMS/IEC 61850 server (libiec61850), logical devices + data sets, no auth"
      oida.ports: "102"

  mms-goose:
    image: mms-libiec61850
    command: ["/usr/local/bin/server_example_goose"]
    container_name: mms-goose-server
    hostname: mms-goose
    ports:
      - "10106:102"     # MMS for GoCB enumeration (offset to avoid conflict with mms-libiec61850)
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/102"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.protocol: "goose"
      oida.group: "mms"
      oida.description: "MMS/IEC 61850 server with GOOSE publisher, multicast L2 frames"
      oida.ports: "10106"

  mms-control:
    image: mms-libiec61850
    command: ["/usr/local/bin/server_example_control"]
    container_name: mms-control-server
    hostname: mms-control
    ports:
      - "10107:102"     # MMS with control model (offset to avoid conflict)
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/102"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.protocol: "mms"
      oida.group: "mms"
      oida.description: "MMS/IEC 61850 server with IEC 61850 control model (SBO/direct operate)"
      oida.ports: "10107"

  mms-authentication:
    image: mms-libiec61850
    command: ["/usr/local/bin/mms_tls_auth_server"]
    container_name: mms-authentication-server
    hostname: mms-authentication
    ports:
      - "10108:102"
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/102"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.protocol: "mms"
      oida.group: "mms"
      oida.description: "MMS with TLS + password auth (admin:admin@mms, operator:operator@mms)"
      oida.ports: "10108"

  # ============================================================================
  # IEC 60870-5-104
  # ============================================================================

  iec104-lib60870:
    build:
      context: ./services/iec104
      dockerfile: Dockerfile
    container_name: iec104-lib60870-server
    hostname: iec104-server
    ports:
      - "2404:2404"     # IEC 60870-5-104 (lib60870-based)
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/2404"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      oida.group: "iec104"
      oida.description: "IEC 60870-5-104 server (lib60870), monitored + command points, no auth"
      oida.ports: "2404"

  iec104-tls:
    build:
      context: ./services/iec104
      dockerfile: Dockerfile.tls
    container_name: iec104-tls-server
    hostname: iec104-tls
    ports:
      - "19998:19998"     # IEC 62351-3 TLS
    environment:
      - TZ=UTC
    volumes:
      - ./certs/ca.pem:/certs/ca.pem:ro
      - ./certs/iec104-tls/server.pem:/certs/server.pem:ro
      - ./certs/iec104-tls/server.key:/certs/server.key:ro
      - ./certs/client.pem:/certs/client.pem:ro
      - ./certs/client.key:/certs/client.key:ro
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/19998"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      oida.group: "iec104"
      oida.description: "IEC 60870-5-104 TLS server (IEC 62351-3), self-signed cert, no client auth"
      oida.ports: "19998"

  # Python-based IEC104 server with custom Type ID support (for testing --probe-custom-types)
  iec104-custom-types:
    build:
      context: ./services
      dockerfile: iec104/Dockerfile.python
    container_name: iec104-custom-types-server
    hostname: iec104-custom
    ports:
      - "2405:2404"     # IEC 60870-5-104 with custom types (port 2405)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/2404"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "iec104"
      oida.description: "IEC 60870-5-104 server with custom/private Type IDs for fuzzing"
      oida.ports: "2405"

  # Conpot IEC 104 Honeypot (Honeynet Project)
  # Custom template: 8 data categories (Type 1/3/11/13/45/46/49/50), COA=1
  iec104-conpot:
    build:
      context: ./services/conpot-iec104
      dockerfile: Dockerfile
    container_name: iec104-conpot-server
    hostname: iec104-conpot
    ports:
      - "2409:2404"     # IEC 104 (Conpot, mapped to 2409 to avoid conflict)
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 2404), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.protocol: "iec104"
      oida.group: "iec104"
      oida.description: "Conpot IEC 104 honeypot, Siemens S7-300 CP 343-1 sim, 8 data categories"
      oida.ports: "2409"

  # ============================================================================
  # Siemens S7 / Snap7
  # ============================================================================

  s7comm-snap7:
    build:
      context: ./services
      dockerfile: Dockerfile.snap7
    container_name: s7comm-snap7-server
    hostname: s7comm-snap7
    ports:
      - "10102:102"     # Siemens S7 (mapped to 10102 to avoid MMS conflict)
    environment:
      - TZ=UTC
      - SNAP7_CPU_TYPE=1200
      - SNAP7_DB_COUNT=10
      - SNAP7_PASSWORD=1234
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "102"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "s7comm"
      oida.description: "Siemens S7comm server (Snap7), CPU 1200 sim, 10 data blocks, password=1234"
      oida.ports: "10102"

  # Conpot S7comm Honeypot (Honeynet Project)
  s7comm-conpot:
    build:
      context: ./services/conpot-s7
      dockerfile: Dockerfile
    container_name: s7comm-conpot-server
    hostname: s7comm-conpot
    ports:
      - "10109:10201"    # S7comm (Conpot internal port 10201, mapped to 10109)
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 10201), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.protocol: "s7comm"
      oida.group: "s7comm"
      oida.description: "Conpot S7comm honeypot, Siemens S7-300 CPU 315-2 PN/DP sim, SZL responses"
      oida.ports: "10109"

  # SoftPlc S7 Simulator (fbarresi/softplc)
  # .NET-based S7comm server with REST API for data block management
  # https://github.com/fbarresi/SoftPlc
  s7comm-softplc:
    image: fbarresi/softplc:latest-linux
    container_name: s7comm-softplc-server
    hostname: s7comm-softplc
    ports:
      - "10110:102"     # S7comm TPKT/COTP (mapped to 10110 to avoid MMS/Snap7 conflict)
      - "8082:8080"     # REST API (Swagger UI for data block management)
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/102' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.group: "s7comm"
      oida.description: "SoftPlc S7comm simulator (.NET), REST API :8082 for data block management, no auth"
      oida.ports: "10110, 8082"

  # ============================================================================
  # KNX
  # ============================================================================

  knx-calimero:
    image: calimeroproject/knxserver:latest
    container_name: knx-calimero-server
    hostname: knx-server
    stdin_open: true
    tty: true
    ports:
      - "3671:3671/udp"   # KNXnet/IP UDP (standard)
      - "3671:3671/tcp"   # KNXnet/IP TCP tunneling
    volumes:
      - ./services/knx/server-config.xml:/config/server-config.xml:ro
      - ./services/knx/datapoints.xml:/config/datapoints.xml:ro
    environment:
      - TZ=UTC
    command: ["/config/server-config.xml"]
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "nc", "-z", "knx-server", "3671"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      oida.group: "knx"
      oida.description: "KNXnet/IP gateway (Calimero) with emulated subnet, tunnelling + routing"
      oida.ports: "3671"

  knx-devices:
    build:
      context: ./services
      dockerfile: Dockerfile.knx-devices
    container_name: knx-bcu-emulator
    hostname: knx-devices
    depends_on:
      knx-calimero:
        condition: service_healthy
    environment:
      - TZ=UTC
      - KNX_GATEWAY_HOST=knx-server
      - KNX_GATEWAY_PORT=3671
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      oida.group: "knx"
      oida.description: "KNX BCU device emulator, 5 devices (1.1.1-1.1.5), management services, auth testing"
      oida.ports: ""

  # ============================================================================
  # MQTT
  # ============================================================================

  mqtt-insecure:
    build:
      context: ./services/mqtt
      dockerfile: Dockerfile
    container_name: mqtt-insecure-broker
    hostname: mqtt-insecure
    command: ["python3", "mqtt_broker_insecure.py"]
    ports:
      - "1883:1883"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
