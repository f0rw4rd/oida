  # ============================================================================
  # HAPI FHIR JPA Server (REAL) - official hapiproject/hapi image (Apache-2.0)
  # https://github.com/hapifhir/hapi-fhir-jpaserver-starter
  # Genuine Spring-Boot FHIR server, embedded H2 (no external DB). Nothing is
  # vendored - the official image is pulled at runtime; only mounted yaml config
  # (./services/fhir/hapi/) is committed. CapabilityStatement at /fhir/metadata.
  # ============================================================================

  fhir-hapi-r4:
    image: hapiproject/hapi:v8.6.5-1
    container_name: fhir-hapi-r4-server
    hostname: fhir-hapi-r4
    ports:
      - "8090:8080"     # FHIR R4 REST API (real HAPI JPA, permissive)
    environment:
      - TZ=UTC
      # Additive: layer our overrides ON TOP of the image's bundled
      # application.yaml (do NOT replace it - replacing drops keys the app
      # needs and breaks bean wiring). Arg form passed as a Spring env override.
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:///configs/application.yaml
    volumes:
      - ./services/fhir/hapi/application-r4.yaml:/configs/application.yaml:ro
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      # Image is distroless (only `java` is present - no curl/sh/wget), so this
      # is a JVM-liveness check; the real /fhir/metadata round-trip is verified
      # from the host. Same pattern as the knx-devices Java mock.
      test: ["CMD", "java", "-version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    labels:
      oida.group: "fhir"
      oida.description: "HAPI FHIR JPA server (real, Apache-2.0), FHIR R4, embedded H2, permissive, no auth"
