  # ============================================================================
  # OCPP (Open Charge Point Protocol) Mock CSMS
  # ============================================================================

  ocpp-insecure:
    build:
      context: ./services/ocpp/mock
      dockerfile: Dockerfile.ocpp
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-ocpp:latest
    container_name: ocpp-insecure-csms
    hostname: ocpp-insecure
    ports:
      - "9000:9000"     # OCPP ws:// (insecure — no auth, accepts everything)
      - "9001:9001"     # OCPP ws:// (secure — HTTP Basic Auth, hardened)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; [socket.create_connection(('localhost', p), timeout=2).close() for p in [9000, 9001]]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      oida.protocol: "ocpp"
      oida.group: "ocpp"
      oida.description: "OCPP 1.6/2.0.1 CSMS, insecure ws://9000 + secure ws://9001 (CP001:SecureKey123)"
      oida.ports: "9000, 9001"

  # ============================================================================
  # SteVe (real OCPP 1.2/1.5/1.6 Central System / CSMS)
  # GPL-3.0 — built from source at image-build time, NO binaries committed.
  # See ./services/ocpp/steve/README.md for the license note + config matrix.
  # One MariaDB backend + three SteVe app containers sharing one built image,
  # differing only by runtime Spring -D overrides and per-config DB schema.
  # ============================================================================

  ocpp-steve-db:
    image: mariadb:10.11.16
    container_name: ocpp-steve-db
    hostname: ocpp-steve-db
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=stevedb
      - MYSQL_USER=steve
      - MYSQL_PASSWORD=changeme
      - TZ=+00:00
    volumes:
      - ocpp-steve-db-data:/var/lib/mysql
      - ./services/ocpp/steve/initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      oida.protocol: "ocpp"
      oida.group: "ocpp"
      oida.description: "SteVe OCPP CSMS MariaDB backend (steve:changeme), schemas: stevedb_open/registered/secure"
      oida.ports: ""

  # Config 1: OPEN — auto-registers unknown stations, accepts BootNotification
  # from ANY chargeBoxId. ws:// on 8180.
  ocpp-steve-open:
    build:
      context: ./services/ocpp/steve
      dockerfile: Dockerfile.steve
      args:
        STEVE_TAG: steve-3.13.0
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-ocpp-steve:latest
    container_name: ocpp-steve-open
    hostname: ocpp-steve-open
    depends_on:
      ocpp-steve-db:
        condition: service_healthy
    ports:
      - "8180:8180"     # SteVe HTTP — web UI :/steve/manager, ws OCPP
    environment:
      - TZ=UTC
      - BUILD_DB_SCHEMA=stevedb_open
      - JAVA_OPTS=-Dspring.datasource.url=jdbc:mariadb://ocpp-steve-db:3306/stevedb_open
        -Dserver.address=0.0.0.0 -Dserver.port=8180
        -Dsteve.ocpp.auto-register-unknown-stations=true
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8180/steve/manager/signin || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    labels:
      oida.protocol: "ocpp"
      oida.group: "ocpp"
      oida.description: "Real SteVe OCPP 1.6J CSMS (open), ws://8180/steve/websocket/CentralSystemService/<id>, auto-registers any CP, web UI admin:1234"
      oida.ports: "8180"

  # Config 2: REGISTERED-ONLY — rejects unknown chargeBoxIds (auto-register
  # false). Only pre-registered (via web UI/API) charge boxes are accepted.
  ocpp-steve-registered:
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-ocpp-steve:latest
    container_name: ocpp-steve-registered
    hostname: ocpp-steve-registered
    depends_on:
      ocpp-steve-db:
        condition: service_healthy
      ocpp-steve-open:
        condition: service_started
    ports:
      - "8181:8180"     # SteVe HTTP (registered-only)
    environment:
      - TZ=UTC
      - BUILD_DB_SCHEMA=stevedb_registered
      - JAVA_OPTS=-Dspring.datasource.url=jdbc:mariadb://ocpp-steve-db:3306/stevedb_registered
        -Dserver.address=0.0.0.0 -Dserver.port=8180
        -Dsteve.ocpp.auto-register-unknown-stations=false
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8180/steve/manager/signin || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    labels:
      oida.protocol: "ocpp"
      oida.group: "ocpp"
      oida.description: "Real SteVe OCPP 1.6J CSMS (registered-only), ws://8181/steve/..., rejects unknown CP (auto-register off), web UI admin:1234"
      oida.ports: "8181"

  # Config 3: SECURE — HTTPS/WSS with a self-signed PKCS12 keystore generated
  # at container start; rejects unknown chargeBoxIds. wss:// on 8543.
  ocpp-steve-secure:
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-ocpp-steve:latest
    container_name: ocpp-steve-secure
    hostname: ocpp-steve-secure
    depends_on:
      ocpp-steve-db:
        condition: service_healthy
      ocpp-steve-open:
        condition: service_started
    ports:
      - "8543:8443"     # SteVe HTTPS — wss OCPP + web UI over TLS
    environment:
      - TZ=UTC
    command:
      - "sh"
      - "-c"
      - |
        set -e
        KS=/tmp/steve-keystore.p12
        if [ ! -f "$$KS" ]; then
          keytool -genkeypair -alias steve -keyalg RSA -keysize 2048 \
            -validity 3650 -storetype PKCS12 -keystore "$$KS" \
            -storepass changeit -keypass changeit \
            -dname "CN=ocpp-steve-secure, O=OIDA, C=DE" \
            -ext "SAN=dns:ocpp-steve-secure,dns:localhost,ip:127.0.0.1"
        fi
        dockerize -wait tcp://ocpp-steve-db:3306 -timeout 120s
        ./mvnw --batch-mode clean package -Pdocker,mariadb \
          -Ddb.ip=ocpp-steve-db -Ddb.port=3306 -Ddb.schema=stevedb_secure \
          -Ddb.user=steve -Ddb.password=changeme \
          -Djdk.tls.client.protocols="TLSv1,TLSv1.1,TLSv1.2"
        exec java -XX:MaxRAMPercentage=75 \
          -Dspring.datasource.url=jdbc:mariadb://ocpp-steve-db:3306/stevedb_secure \
          -Dserver.address=0.0.0.0 \
          -Dserver.port=8443 \
          -Dhttp.enabled=false \
          -Dserver.ssl.enabled=true \
          -Dserver.ssl.key-store-type=PKCS12 \
          -Dserver.ssl.key-store="$$KS" \
          -Dserver.ssl.key-store-password=changeit \
          -Dserver.ssl.key-alias=steve \
          -Dsteve.ocpp.auto-register-unknown-stations=false \
          -jar target/steve.war
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk -o /dev/null https://localhost:8443/steve/manager/signin || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    labels:
      oida.protocol: "ocpp"
      oida.group: "ocpp"
      oida.description: "Real SteVe OCPP 1.6J CSMS (secure/TLS), wss://8543/steve/..., self-signed keystore, rejects unknown CP, web UI admin:1234"
      oida.ports: "8543"

  # ============================================================================
  # CAN Bus Mock (UDP multicast — no kernel modules needed)
  # ============================================================================

  # ============================================================================
  # Layer 2 / Multicast Services (profiled - require host networking)
  # ============================================================================

  can-mock:
    build:
      context: ./services/can/mock
      dockerfile: Dockerfile.can
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-can:latest
    container_name: can-mock-server
    hostname: can-mock
    network_mode: host
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - CAN_MULTICAST_PORT=43113
      # Throttle the background noise flood for deterministic, fast integration
      # tests. Heartbeats, J1939 broadcasts/Address-Claimed and every protocol
      # responder stay fully active -- only the high-frequency noise senders are
      # stretched. Remove this line for a realistic full-rate (~3700 fps) bus.
      - CAN_QUIET=1
    restart: unless-stopped
    profiles: ["can"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'ping', ('239.0.0.1', 43113)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      oida.protocol: "can"
      oida.group: "can"
      oida.description: "CAN bus gateway sim, UDP multicast 239.0.0.1:43113, host networking"
      oida.ports: "43113/udp"

  # ----------------------------------------------------------------------------
  # Real CANopen nodes (genuine canopen.LocalNode stack on SocketCAN vcan0).
  #
  # Unlike can-mock (a UDP-multicast SIMULATION), these run an actual CiA-301
  # CANopen device: heartbeat producer + SDO server answering identity-object
  # uploads (0x1000/0x1008/0x1018/...). Each service creates its OWN vcan0 in
  # its OWN network namespace at start-up, so it needs NET_ADMIN (privileged
  # here for portability; cap_add: [NET_ADMIN] also works on most hosts).
  #
  # CAN is L2 / NON-ROUTABLE: there are no TCP/UDP ports to publish, and a
  # scanner CANNOT reach the bus over ics-network. To scan, share the node's
  # netns:  docker run --rm --network container:canopen-401-io \
  #             -v $PWD:/oida -w /oida python:3.11-slim \
  #             sh -c 'pip install -e ".[can,fuzz]" && oida can vcan0 --canopen-scan'
  # Two co-resident nodes on one bus: start canopen-402-drive with
  #   network_mode: "container:canopen-401-io"  (already wired below).
  # ----------------------------------------------------------------------------
  canopen-401-io:
    build:
      context: ./services/can/mock
      dockerfile: Dockerfile.canopen
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-canopen:latest
    container_name: canopen-401-io
    hostname: canopen-401-io
    privileged: true              # NET_ADMIN to create/up vcan0; cap_add also works
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - CANOPEN_CHANNEL=vcan0
      - CANOPEN_NODE_ID=1
      - CANOPEN_PROFILE=401       # CiA-401 Generic I/O -> device type 0x00000191
      - CANOPEN_VENDOR_ID=0x000002AA
      - CANOPEN_PRODUCT_CODE=0x00000401
      - CANOPEN_REVISION=0x00010003
      - CANOPEN_SERIAL=0x10000001
      - CANOPEN_DEVICE_NAME=OIDA-IO-401
      - CANOPEN_HW_VERSION=HW-1.0
      - CANOPEN_SW_VERSION=IO-2.1.0
      - CANOPEN_HEARTBEAT_MS=1000
    restart: unless-stopped
    profiles: ["can", "canopen"]
    healthcheck:
      test: ["CMD-SHELL", "ip link show vcan0 | grep -q UP && pgrep -f canopen_node.py >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s
    labels:
      oida.protocol: "can"
      oida.group: "can"
      oida.description: "Real CANopen node, node-id 1, CiA-401 Generic I/O, vcan0 (SocketCAN). Scan via shared netns: --network container:canopen-401-io"
      oida.ports: "none (L2 CAN bus, vcan0)"

  canopen-402-drive:
    build:
      context: ./services/can/mock
      dockerfile: Dockerfile.canopen
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-canopen:latest
    container_name: canopen-402-drive
    # Share canopen-401-io's netns so BOTH nodes sit on the SAME vcan0 bus and
    # a single `oida can vcan0 --canopen-scan` discovers both. The link is
    # already created+UP by canopen-401-io; this container only adds node 4.
    network_mode: "container:canopen-401-io"
    depends_on:
      canopen-401-io:
        condition: service_healthy
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - CANOPEN_CHANNEL=vcan0
      - CANOPEN_NODE_ID=4
      - CANOPEN_PROFILE=402       # CiA-402 Drives/Motion -> device type 0x00000192
      - CANOPEN_VENDOR_ID=0x0000012D
      - CANOPEN_PRODUCT_CODE=0x00040200
      - CANOPEN_REVISION=0x00020001
      - CANOPEN_SERIAL=0x40000007
      - CANOPEN_DEVICE_NAME=OIDA-DRIVE-402
      - CANOPEN_HW_VERSION=DRV-HW-2.0
      - CANOPEN_SW_VERSION=DRV-3.4.1
      - CANOPEN_HEARTBEAT_MS=1000
    restart: unless-stopped
    profiles: ["can", "canopen"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f canopen_node.py >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s
    labels:
      oida.protocol: "can"
      oida.group: "can"
      oida.description: "Real CANopen node, node-id 4, CiA-402 Drives/Motion, co-resident on canopen-401-io's vcan0 bus"
      oida.ports: "none (L2 CAN bus, shared vcan0)"

  ethercat-slave:
    build:
      context: ./services/ethercat/mock
      dockerfile: Dockerfile.ethercat
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-ethercat:latest
    container_name: ethercat-slave-device
    hostname: ethercat-slave
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - TZ=UTC
      - ETHERCAT_INTERFACE=eth0
      - ETHERCAT_POSITION=1
      - ETHERCAT_VERBOSITY=1
      - ETHERCAT_CREATE_VETH=0
    restart: unless-stopped
    profiles: ["ethercat"]
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.protocol: "ethercat"
      oida.group: "ethercat"
      oida.description: "EtherCAT slave device sim, raw L2 frames, host networking, requires root"
      oida.ports: "L2"

  # EtherCAT slave with self-contained veth pair for testing without hardware.
  # Creates ecat0/ecat1 pair inside the container; bridges ecat1 to eth0
  # so frames from the Docker bridge reach the slave.
  # Test with: oida ethercat br-ecat  (from host, targeting Docker bridge)
  ethercat-slave-veth:
    build:
      context: ./services/ethercat/mock
      dockerfile: Dockerfile.ethercat
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-ethercat:latest
    container_name: ethercat-slave-veth
    hostname: ethercat-veth
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - TZ=UTC
      - ETHERCAT_INTERFACE=eth0
      - ETHERCAT_POSITION=1
      - ETHERCAT_VERBOSITY=1
      - ETHERCAT_CREATE_VETH=1
    restart: unless-stopped
    profiles: ["ethercat"]
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.protocol: "ethercat"
      oida.group: "ethercat"
      oida.description: "EtherCAT slave with veth pair, bridge networking, self-contained testing"
      oida.ports: "L2"

  # ── EtherCAT slaves: REAL software slave simulator (leducp/KickCAT) ───────
  #
  # Replaces the hand-written ethercat_slave.c sim with leducp/KickCAT's
  # `network_simulator`, built FROM SOURCE (no committed binaries; CeCILL-C,
  # attribution + LICENSE bundled at /opt/oida/KickCAT-LICENSE in the image).
  # KickCAT is a real EtherCAT Slave Controller emulator (EmulatedESC: ESC
  # registers, SyncManagers, FMMUs, EEPROM/SII compiled from ESI XML, CoE
  # mailbox, DC clock). Two DISTINCT slaves are daisy-chained on the bus, each
  # built from its own vendor ESI XML:
  #   Slave 1  EVS-NET-01  vendor 0x029C (INGENIA-CAT)  product 0x03B11002  rev 0x00050005  (DS402 servo drive, 11 in / 11 out)
  #   Slave 2  Relax       vendor 0x06A5 (Wandercraft)  product 0x00B0CAD0  rev 0x00000001  (XMC4800 dev board, 2 in / 0 out)
  #
  # WHY IT IS SOEM-DISCOVERABLE (the whole point -- `oida ethercat` is a SOEM
  # master via pysoem): given a PLAIN interface name (not "tap:server"),
  # network_simulator opens a real PF_PACKET/SOCK_RAW socket on that Linux
  # interface (EtherType 0x88A4) -- the same L2 mechanism SOEM uses. The
  # entrypoint creates an internal veth pair (ecatsimA <-> ecatsimB); the
  # simulator binds ecatsimA, and any SOEM master in this container's netns
  # targets ecatsimB.
  #
  # REACHABILITY (verified end-to-end with the REAL `oida ethercat` CLI):
  #   EtherCAT is raw Layer 2, non-routable -- NO TCP/UDP ports. The slaves are
  #   reachable ONLY inside this container's network namespace. Scan from the
  #   SAME netns, either:
  #     (a) sidecar sharing the netns:
  #           docker run --rm --network container:ethercat-kickcat-slaves \
  #             --cap-add NET_RAW --cap-add NET_ADMIN <oida-image> \
  #             oida ethercat ecatsimB
  #     (b) or run oida inside this container's netns however you prefer.
  #   Verified output: 2 slaves, distinct vendor/product/revision + PDO layouts.
  #   Requires CAP_NET_RAW (raw socket) + CAP_NET_ADMIN (veth + promisc).
  ethercat-kickcat-slaves:
    build:
      context: ./services/ethercat/mock
      dockerfile: Dockerfile.ethercat-kickcat
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-ethercat-kickcat:latest
    container_name: ethercat-kickcat-slaves
    hostname: ethercat-kickcat
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - TZ=UTC
      - ECAT_IF_SLAVE=ecatsimA
      - ECAT_IF_SCAN=ecatsimB
    restart: unless-stopped
    profiles: ["ethercat"]
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.protocol: "ethercat"
      oida.group: "ethercat"
      oida.description: "Real software EtherCAT slaves (KickCAT network_simulator, source-built), 2 distinct identities (Ingenia EVS-NET-01 + Infineon XMC4800 Relax), raw L2 0x88A4, SOEM/pysoem-discoverable via internal veth pair (scan ecatsimB from same netns)"
      oida.ports: "L2"

  # ── PROFINET IO devices: real, source-built p-net (rtlabs) stack ──────────
  #
  # Two DISTINCT configs from ONE Dockerfile. vendor_id / device_id are baked
  # at IMAGE-BUILD time via build args (the GSDML header #ifndef-guards them so
  # -DAPP_GSDML_* wins), therefore each config needs its OWN image tag -- unlike
  # the bacnet-realstack pattern where variants differ only at runtime. Station
  # name stays runtime via PNET_STATION_NAME (-s).
  #
  # REACHABILITY (verified on the wire with tcpdump + tshark + the real OIDA
  # scanner): a Docker user-defined bridge (ics-network) FORWARDS the DCP
  # Identify-All multicast (dst 01:0e:cf:00:00:00, EtherType 0x8892) between
  # sibling containers. A scanner container on ics-network -- or a host-side
  # `sudo oida profinet <docker-bridge-iface>` -- discovers BOTH devices with a
  # single Identify-All. No veth/netns/macvlan tricks needed.
  #
  # Config A: Siemens ET 200SP  -- vendor 0x002A (SIEMENS AG), device 0x0301
  profinet-siemens-et200sp:
    build:
      context: ./services/profinet/mock
      dockerfile: Dockerfile.profinet
      args:
        APP_VENDOR_ID: "0x002A"
        APP_DEVICE_ID: "0x0301"
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-profinet:siemens-et200sp
    container_name: profinet-siemens-et200sp
    hostname: profinet-siemens
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - TZ=UTC
      - PNET_STATION_NAME=siemens-et200sp
      - PNET_INTERFACE=eth0
      - PNET_VERBOSITY=2
    restart: unless-stopped
    profiles: ["profinet"]
    networks:
      - ics-network
    healthcheck:
      # No listening port (raw L2 device); health = the pn_dev process (PID 1)
      # is alive, which only happens once it has bound the interface.
      test: ["CMD-SHELL", "grep -q pn_dev /proc/1/comm || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.protocol: "profinet"
      oida.group: "profinet"
      oida.description: "Real p-net PROFINET IO device, station siemens-et200sp, vendor 0x002A (SIEMENS AG) device 0x0301, DCP Identify-All over raw L2 (0x8892) on ics-network bridge"
      oida.ports: "L2"

  # Config B: Beckhoff EL6631   -- vendor 0x0120 (Beckhoff), device 0x0002
  profinet-beckhoff-el6631:
    build:
      context: ./services/profinet/mock
      dockerfile: Dockerfile.profinet
      args:
        APP_VENDOR_ID: "0x0120"
        APP_DEVICE_ID: "0x0002"
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-profinet:beckhoff-el6631
    container_name: profinet-beckhoff-el6631
    hostname: profinet-beckhoff
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - TZ=UTC
      - PNET_STATION_NAME=beckhoff-el6631
      - PNET_INTERFACE=eth0
      - PNET_VERBOSITY=2
    restart: unless-stopped
    profiles: ["profinet"]
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "grep -q pn_dev /proc/1/comm || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.protocol: "profinet"
      oida.group: "profinet"
      oida.description: "Real p-net PROFINET IO device, station beckhoff-el6631, vendor 0x0120 (Beckhoff) device 0x0002, DCP Identify-All over raw L2 (0x8892) on ics-network bridge"
      oida.ports: "L2"

  goose-l2-publisher:
    build:
      context: ./services/goose/mock
      dockerfile: Dockerfile.goose-real
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-goose-real:latest
    container_name: goose-l2-publisher
