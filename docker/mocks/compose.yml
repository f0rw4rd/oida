  # ============================================================================

  dicom-orthanc:
    image: jodogne/orthanc-plugins:1.12.3
    container_name: dicom-orthanc
    hostname: orthanc
    ports:
      - "4242:4242"       # DICOM (standard port 104 equivalent)
      - "8042:8042"       # Web UI / REST API
    volumes:
      - ./services/dicom/mock/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-data:/var/lib/orthanc/db
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8042/system"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      oida.group: "dicom"
      oida.description: "Orthanc PACS server (AET: ORTHANC_PACS, REST: 8042, no auth)"
      oida.ports: "4242, 8042"

  # ============================================================================
  # Mirth Connect (Full-Featured HL7 Engine)
  # ============================================================================

  hl7-mirth-db:
    image: postgres:15-alpine
    container_name: hl7-mirth-db
    hostname: mirth-db
    environment:
      - POSTGRES_USER=mirth
      - POSTGRES_PASSWORD=mirth
      - POSTGRES_DB=mirthdb
    volumes:
      - mirth-db-data:/var/lib/postgresql/data
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirth -d mirthdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      oida.group: "hl7"
      oida.description: "HL7 Mirth Connect PostgreSQL backend, db: mirthdb (mirth:mirth)"
      oida.ports: ""

  hl7-mirth:
    image: nextgenhealthcare/connect:4.5.0
    container_name: hl7-mirth
    hostname: mirth
    depends_on:
      hl7-mirth-db:
        condition: service_healthy
    ports:
      - "8443:8443"       # Mirth Administrator (HTTPS)
      - "8080:8080"       # HTTP API
      - "6661:6661"       # HL7 MLLP Channel 1 (ADT)
      - "6662:6662"       # HL7 MLLP Channel 2 (ORU)
      - "6663:6663"       # HL7 MLLP Channel 3 (ORM)
    environment:
      - TZ=UTC
      - DATABASE=postgres
      - DATABASE_URL=jdbc:postgresql://mirth-db:5432/mirthdb
      - DATABASE_USERNAME=mirth
      - DATABASE_PASSWORD=mirth
      - VMOPTIONS=-Xmx512m
    volumes:
      - ./services/hl7/mock/mirth/channels:/opt/connect/channels:ro
      - mirth-appdata:/opt/connect/appdata
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null https://localhost:8443/api/system/stats || test $? -eq 22"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      oida.group: "hl7"
      oida.description: "Mirth Connect HL7 integration engine, web UI :8443, MLLP :6661-6663 (mirth:mirth)"
      oida.ports: "8443, 6661-6663"

networks:
  ics-network:
    # No subnet/ipam pin: Docker picks a free subnet from its default address
    # pools, so the stack can't clash with a host that already routes a given
    # range (VPN, another bridge, etc.). Nothing depends on a fixed range -
    # the ADS mocks derive their AMS NetId and loopback subnet from whatever
    # interface Docker assigns them.
    driver: bridge

volumes:
  logs:
  orthanc-data:
  mirth-db-data:
  mirth-appdata:
  ocpp-steve-db-data:
