      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.protocol: "http2"
      oida.group: "http2"
      oida.description: "HTTP/2 server (C, nghttp2), TLS + cleartext, frame logging enabled"
      oida.ports: "8280, 8281"

