      - GOOSE_GOCB_REF=simpleIOGenericIO/LLN0$$GO$$gcbAnalogValues
      - GOOSE_DATASET_REF=simpleIOGenericIO/LLN0$$AnalogValues
      - GOOSE_GO_ID=OIDA-GOOSE-Analog
