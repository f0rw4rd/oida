# Core ICS + Network Mock Services
# Start with: just up (or docker compose -f compose.yml up -d)

services:
  modbus-mock:
    build:
      context: ./services/modbus/mock
      dockerfile: Dockerfile.modbus
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-modbus:latest
    container_name: modbus-mock-server
    hostname: modbus-server
    ports:
      - "502:502"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 502), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "modbus"
      oida.description: "Modbus TCP server, unit IDs 1-10, coils/registers/input, no auth"
      oida.ports: "502"

  modbus-tls:
    build:
      context: ./services/modbus/mock
      dockerfile: Dockerfile.modbus-tls
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-modbus-tls:latest
    container_name: modbus-tls-server
    hostname: modbus-tls
    ports:
      - "802:802"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - MODBUS_TLS_PORT=802
      - MODBUS_MTLS=1
    volumes:
      - ./certs/ca.pem:/certs/ca.pem:ro
      - ./certs/modbus-tls/server.pem:/certs/server.pem:ro
      - ./certs/modbus-tls/server.key:/certs/server.key:ro
      - ./certs/client.pem:/certs/client.pem:ro
      - ./certs/client.key:/certs/client.key:ro
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 802), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "modbus"
      oida.description: "Modbus TLS with mTLS client auth"
      oida.ports: "802"

  modbus-rtu-tcp:
    build:
      context: ./services/modbus/mock
      dockerfile: Dockerfile.modbus-rtu-tcp
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-modbus-rtu-tcp:latest
    container_name: modbus-rtu-tcp-server
    hostname: modbus-rtu-tcp
    ports:
      - "5030:5030"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - MODBUS_RTU_TCP_PORT=5030
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 5030), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "modbus"
      oida.description: "Modbus RTU-over-TCP gateway (3 slave units)"
      oida.ports: "5030"

  # Conpot Modbus TCP Honeypot (Honeynet Project)
  modbus-conpot:
    build:
      context: ./services/modbus/mock/conpot
      dockerfile: Dockerfile
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-conpot-modbus:latest
    container_name: modbus-conpot-server
    hostname: modbus-conpot
    ports:
      - "5503:5020"
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 5020), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.protocol: "modbus"
      oida.group: "modbus"
      oida.description: "Conpot Modbus TCP honeypot, Schneider M340 sim, FC 1-4 + MEI device ID"
      oida.ports: "5503"

  opcua-mock:
    build:
      context: ./services/opcua/mock
      dockerfile: Dockerfile.opcua
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-opcua:latest
    container_name: opcua-mock-server
    hostname: opcua-server
    ports:
      - "4840:4840"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 4840), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "opcua"
      oida.description: "OPC UA server, anonymous access, no encryption, standard namespace"
      oida.ports: "4840"

  ads-mock:
    build:
      context: ./services/ads/mock
      dockerfile: Dockerfile.ads
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-ads:latest
    container_name: ads-mock-server
    hostname: ads-server
    ports:
      - "48898:48898"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 48898), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "ads"
      oida.description: "Beckhoff ADS/TwinCAT simulation (Python sim, no auth)"
      oida.ports: "48898"

  ads-twincat-motor:
    build:
      context: ./services/ads/mock
      dockerfile: Dockerfile.ads-twincat
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-ads-twincat:latest
    container_name: ads-twincat-motor
    hostname: ads-twincat-motor
    ports:
      - "48901:48898"
    environment:
      # NetId and loopback subnet are derived at startup from the container's
      # own interface (<ip>.1.1 / <network>), so no static IP pin, hardcoded
      # NetId, or pinned subnet is needed.
      - AmsRouter__Name=OIDA-TwinCAT-Motor
      # Symbol-server profile (motor controller).
      - OIDA_DEVICE_NAME=OIDA-Motor
      - OIDA_DEVICE_VERSION=3.1.4024
      - OIDA_ADS_STATE=Run
      - OIDA_DEVICE_STATE=0
      - OIDA_SYMBOLS=GVL.MotorSpeed:REAL:1480.5,GVL.Current:REAL:12.7,GVL.Running:BOOL:1,GVL.Temperature:INT:42
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "dotnet", "OidaTwinCatMock.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      oida.group: "ads"
      oida.description: "REAL Beckhoff TwinCAT ADS server (official TwinCAT.Ads .NET, MIT) - motor controller profile, AmsNetId derived from container IP, AMS port 851, state RUN"
      oida.ports: "48901"

  ads-twincat-hvac:
    build:
      context: ./services/ads/mock
      dockerfile: Dockerfile.ads-twincat
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-ads-twincat:latest
    container_name: ads-twincat-hvac
    hostname: ads-twincat-hvac
    ports:
      - "48902:48898"
    environment:
      # NetId and loopback subnet are derived at startup from the container's
      # own interface (<ip>.1.1 / <network>), so no static IP pin, hardcoded
      # NetId, or pinned subnet is needed.
      - AmsRouter__Name=OIDA-TwinCAT-HVAC
      # Symbol-server profile (HVAC controller).
      - OIDA_DEVICE_NAME=OIDA-HVAC
      - OIDA_DEVICE_VERSION=2.11.2305
      - OIDA_ADS_STATE=Config
      - OIDA_DEVICE_STATE=0
      - OIDA_SYMBOLS=GVL.RoomTemp:REAL:21.5,GVL.Setpoint:REAL:22.0,GVL.FanSpeed:INT:60,GVL.HeatCall:BOOL:0
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "dotnet", "OidaTwinCatMock.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      oida.group: "ads"
      oida.description: "REAL Beckhoff TwinCAT ADS server (official TwinCAT.Ads .NET, MIT) - HVAC controller profile, AmsNetId derived from container IP, AMS port 851, state CONFIG"
      oida.ports: "48902"

  ethernetip-mock:
    build:
      context: ./services/ethernetip/mock
      dockerfile: Dockerfile.ethernetip
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-ethernetip:latest
    container_name: ethernetip-mock-server
    hostname: ethernetip-server
    ports:
      - "44818:44818"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 44818), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "ethernetip"
      oida.description: "EtherNet/IP CIP server, identity + ListServices, no auth"
      oida.ports: "44818"

  bacnet-mock:
    build:
      context: ./services/bacnet/mock
      dockerfile: Dockerfile.bacnet
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-bacnet:latest
    container_name: bacnet-mock-server
    hostname: bacnet-server
    ports:
      - "47808:47808/udp"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x81\\x0a\\x00\\x04', ('localhost', 47808)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "bacnet"
      oida.description: "BACnet/IP server, device 1234, analog/binary/multi-state objects, no auth"
      oida.ports: "47808/udp"

  # Conpot BACnet/IP Honeypot (Honeynet Project)
  bacnet-conpot:
    build:
      context: ./services/bacnet/mock/conpot
      dockerfile: Dockerfile
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-conpot-bacnet:latest
    container_name: bacnet-conpot-server
    hostname: bacnet-conpot
    ports:
      - "47812:47808/udp"
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x81\\x0a\\x00\\x04', ('localhost', 47808)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.protocol: "bacnet"
      oida.group: "bacnet"
      oida.description: "Conpot BACnet/IP honeypot, Alerton VAV-DD controller sim, device 36113, WhoIs/ReadProperty"
      oida.ports: "47812/udp"

  # Real bacnet-stack (Steve Karg) bacserv server - genuine BACnet/IP software,
  # built from source at tag bacnet-stack-1.4.4 (no binaries committed).
  # Three profiles (rtu/building/vav) share one image, differ by device
  # instance, name, vendor id, model, and object inventory.
  # NOTE: bacpypes3 Who-Is auto-discovery is broadcast-based and does not
  # traverse Docker's UDP port-map; scan with `--device-id <instance>`.
  bacnet-realstack-rtu:
    build:
      context: ./services/bacnet/mock/realstack
      dockerfile: Dockerfile.bacnet-realstack
      args:
        BACNET_TAG: bacnet-stack-1.4.4
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-bacnet-realstack:latest
    container_name: bacnet-realstack-rtu
    hostname: bacnet-rtu
    ports:
      - "47820:47808/udp"
    environment:
      - TZ=UTC
      - BACNET_PROFILE=rtu
      - BACNET_DEVICE_INSTANCE=11001
      - BACNET_DEVICE_NAME=RTU-Compact-A
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "nc", "-z", "-u", "localhost", "47808"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.protocol: "bacnet"
      oida.group: "bacnet"
      oida.description: "Real bacnet-stack 1.4.4 bacserv, RTU profile, device 11001, vendor 260, small AI/AO/BI/BO point set"
      oida.ports: "47820/udp"

  bacnet-realstack-building:
    build:
      context: ./services/bacnet/mock/realstack
      dockerfile: Dockerfile.bacnet-realstack
      args:
        BACNET_TAG: bacnet-stack-1.4.4
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-bacnet-realstack:latest
    container_name: bacnet-realstack-building
    hostname: bacnet-building
    ports:
      - "47821:47808/udp"
    environment:
      - TZ=UTC
      - BACNET_PROFILE=building
      - BACNET_DEVICE_INSTANCE=22002
      - BACNET_DEVICE_NAME=Building-Supervisor
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "nc", "-z", "-u", "localhost", "47808"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.protocol: "bacnet"
      oida.group: "bacnet"
      oida.description: "Real bacnet-stack 1.4.4 bacserv, large building-controller profile, device 22002, vendor 15, 12 AI / 8 AO / 10 BI / 6 BO + setpoints"
      oida.ports: "47821/udp"

  bacnet-realstack-vav:
    build:
      context: ./services/bacnet/mock/realstack
      dockerfile: Dockerfile.bacnet-realstack
      args:
        BACNET_TAG: bacnet-stack-1.4.4
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-bacnet-realstack:latest
    container_name: bacnet-realstack-vav
    hostname: bacnet-vav
    ports:
      - "47822:47808/udp"
    environment:
      - TZ=UTC
      - BACNET_PROFILE=vav
      - BACNET_DEVICE_INSTANCE=33003
      - BACNET_DEVICE_NAME=VAV-Box-12
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "nc", "-z", "-u", "localhost", "47808"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.protocol: "bacnet"
      oida.group: "bacnet"
      oida.description: "Real bacnet-stack 1.4.4 bacserv, VAV terminal-unit profile, device 33003, vendor 5, COV-friendly AV/MSV present-values"
      oida.ports: "47822/udp"

  # ============================================================================
  # CoAP Mock Server
  # ============================================================================
  coap-mock:
    build:
      context: ./services/coap/mock
      dockerfile: Dockerfile.coap
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-coap:latest
    container_name: coap-mock-server
    hostname: coap-server
    ports:
      - "5683:5683/udp"
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x40\\x01\\x00\\x01', ('localhost', 5683)); data=s.recv(64); s.close(); assert len(data)>0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "coap"
      oida.description: "CoAP server (aiocoap), /.well-known/core, LwM2M /3/0 device object, observable sensors, writable actuators, NoSec mode"
      oida.ports: "5683/udp"

  coap-libcoap:
    build:
      context: ./services/coap/mock
      dockerfile: Dockerfile.coap-libcoap
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-coap-libcoap:latest
    container_name: coap-libcoap-server
    hostname: coap-libcoap
    ports:
      - "5685:5685/udp"
    environment:
      - TZ=UTC
      - COAP_PORT=5685
      - COAP_VERBOSITY=5
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x40\\x01\\x00\\x01', ('localhost', 5685)); data=s.recv(64); s.close(); assert len(data)>0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.group: "coap"
      oida.description: "CoAP server (libcoap/C), interop testing, dynamic resources, no auth"
      oida.ports: "5685/udp"

  coap-dtls:
    build:
      context: ./services/coap/mock
      dockerfile: Dockerfile.coap-libcoap
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-coap-libcoap:latest
    container_name: coap-dtls-server
    hostname: coap-dtls
    ports:
      - "5684:5684/udp"
    environment:
      - TZ=UTC
      - COAP_PORT=5683
      - COAP_PSK_KEY=secretPSK123
      - COAP_PSK_HINT=oida-client
      - COAP_VERBOSITY=5
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x40\\x01\\x00\\x01', ('localhost', 5683)); data=s.recv(64); s.close(); assert len(data)>0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.group: "coap"
      oida.description: "CoAP server (libcoap/C) with DTLS-PSK encryption, PSK=secretPSK123, hint=oida-client"
      oida.ports: "5684/udp"

  coap-dtls-cert:
    build:
      context: ./services/coap/mock
      dockerfile: Dockerfile.coap-dtls-cert
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-coap-dtls-cert:latest
    container_name: coap-dtls-cert-server
    hostname: coap-dtls-cert
    ports:
      - "5686:5684/udp"
    environment:
      - TZ=UTC
      - COAP_PORT=5683
      - COAP_VERBOSITY=5
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x40\\x01\\x00\\x01', ('localhost', 5683)); data=s.recv(64); s.close(); assert len(data)>0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.group: "coap"
      oida.description: "CoAP server (libcoap/C) with DTLS certificate auth, certs in /app/certs/"
      oida.ports: "5686/udp"

  # ============================================================================
  # MMS / IEC 61850
  # ============================================================================

  mms-libiec61850:
    build:
      context: ./services/mms/mock
      dockerfile: Dockerfile.mms
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-mms:latest
    container_name: mms-libiec61850-server
    hostname: mms-server
    ports:
      - "102:102"       # MMS/IEC 61850 (libiec61850-based)
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/102"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.group: "mms"
      oida.description: "MMS/IEC 61850 server (libiec61850), logical devices + data sets, no auth"
      oida.ports: "102"

  mms-goose:
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-mms:latest
    command: ["/usr/local/bin/server_example_goose"]
    container_name: mms-goose-server
    hostname: mms-goose
    ports:
      - "10106:102"     # MMS for GoCB enumeration (offset to avoid conflict with mms-libiec61850)
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/102"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.protocol: "goose"
      oida.group: "mms"
      oida.description: "MMS/IEC 61850 server with GOOSE publisher, multicast L2 frames"
      oida.ports: "10106"

  mms-control:
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-mms:latest
    command: ["/usr/local/bin/server_example_control"]
    container_name: mms-control-server
    hostname: mms-control
    ports:
      - "10107:102"     # MMS with control model (offset to avoid conflict)
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/102"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      oida.protocol: "mms"
      oida.group: "mms"
      oida.description: "MMS/IEC 61850 server with IEC 61850 control model (SBO/direct operate)"
      oida.ports: "10107"

  mms-authentication:
    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-mms:latest
    command: ["/usr/local/bin/mms_tls_auth_server"]
    container_name: mms-authentication-server
    hostname: mms-authentication
