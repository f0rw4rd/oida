    image: ${OIDA_REGISTRY:?OIDA_REGISTRY is unset - copy docker/mocks/.env.example to docker/mocks/.env}/oida-mock-http2-nghttp2:latest
    container_name: http2-nghttp2-server
    hostname: http2-nghttp2
    ports:
      - "8280:8443"     # HTTP/2 TLS (nghttpd)
      - "8281:8080"     # HTTP/2 cleartext (h2c)
    volumes:
      - ./services/http2/certs:/app/certs:ro
      - ./logs/http2:/var/log/http2:rw
    environment:
      - TZ=UTC
      - HTTP2_VERBOSE=true
      - HTTP2_HEXDUMP=false
      - HTTP2_LOG_FRAMES=true
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "--http2-prior-knowledge", "http://localhost:8080/"]
