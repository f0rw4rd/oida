      retries: 3
      start_period: 30s
    labels:
      oida.group: "hart"
      oida.description: "HART-IP FieldComm hipflowapp flow device, HART 5 (universal rev 5), mfr 0xF9 type 0xFD tag FLOW5DEV, PV mass-flow kg/h, no auth"
