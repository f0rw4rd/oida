    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "snmpget", "-v3", "-u", "engineer", "-a", "SHA", "-A", "engineer1", "-l", "authNoPriv", "-t", "2", "-r", "0", "localhost:161", ".1.3.6.1.2.1.1.1.0"]
