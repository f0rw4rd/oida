    cap_add:
      - NET_ADMIN          # for dummy interfaces, ARP entries
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "snmpget", "-v2c", "-c", "public", "-t", "2", "-r", "0", "localhost:161", ".1.3.6.1.2.1.1.1.0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s
    labels:
      oida.group: "snmp"
      oida.description: "SNMP v2c+v3 (communities: public/private/SCADA/monitor, v3: admin:admin123, engineer:engineer1, monitor:monitor1, operator:operator1)"
      oida.ports: "10161/udp"

  snmp-v3only:
    build:
      context: ./services/snmp
    container_name: snmp-v3only-server
    hostname: snmp-v3only
    ports:
      - "10164:161/udp"    # SNMP UDP (net-snmp, v3 only, hardened)
    environment:
      - TZ=UTC
      - SNMP_PROFILE=v3only
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "snmpget", "-v3", "-u", "engineer", "-a", "SHA", "-A", "engineer1", "-l", "authNoPriv", "-t", "2", "-r", "0", "localhost:161", ".1.3.6.1.2.1.1.1.0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s
    labels:
      oida.group: "snmp"
      oida.description: "SNMP v3-only, no v1/v2c (admin:admin123, engineer:engineer1, operator:operator1, backup:backup12)"
      oida.ports: "10164/udp"

  snmp-switch:
    build:
      context: ./services/snmp
    container_name: snmp-switch-server
    hostname: snmp-switch
    ports:
      - "10162:161/udp"    # SNMP UDP (net-snmp, H3C switch profile)
    environment:
      - TZ=UTC
      - SNMP_PROFILE=switch
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "snmpget", "-v2c", "-c", "public", "-t", "2", "-r", "0", "localhost:161", ".1.3.6.1.2.1.1.1.0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s
    labels:
      oida.group: "snmp"
      oida.description: "SNMP H3C switch (H3C creds, Brocade ADX, bridge FDB)"
      oida.ports: "10162/udp"

  # ============================================================================
  # SunSpec Mock Server (pymodbus)
  # Simulates a 10kW three-phase PV inverter with battery storage
  # Model chain: 1 (Common) -> 103 (Inverter) -> 120 (Nameplate) ->
  #              123 (Controls) -> 124 (Storage) -> 160 (MPPT) -> END
  # Test with: oida modbus -t localhost -p 5502 --sunspec
  # ============================================================================

  modbus-sunspec:
    build:
      context: ./services
      dockerfile: Dockerfile.sunspec
    container_name: modbus-sunspec-server
    hostname: modbus-sunspec
    ports:
      - "5502:5502"       # Modbus TCP (SunSpec)
    environment:
      - TZ=UTC
      - SUNSPEC_PORT=5502
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 5502), timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      oida.group: "modbus"
      oida.description: "SunSpec Modbus solar inverter simulator, SunSpec register map at 40000+, no auth"
      oida.ports: "5502"

  # ============================================================================
  # HTTP/2 Fuzzing Testbed
  # ============================================================================

  http2-nghttp2:
    build:
      context: ./services/http2
      dockerfile: Dockerfile.nghttp2
    container_name: http2-nghttp2-server
    hostname: http2-nghttp2
    ports:
      - "8280:8443"     # HTTP/2 TLS (nghttpd)
      - "8281:8080"     # HTTP/2 cleartext (h2c)
    volumes:
      - ./services/http2/certs:/app/certs:ro
      - ./logs/http2:/var/log/http2:rw
    environment:
      - TZ=UTC
      - HTTP2_VERBOSE=true
      - HTTP2_HEXDUMP=false
      - HTTP2_LOG_FRAMES=true
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "--http2-prior-knowledge", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.protocol: "http2"
      oida.group: "http2"
      oida.description: "HTTP/2 server (C, nghttp2), TLS + cleartext, frame logging enabled"
      oida.ports: "8280, 8281"

  http2-python:
    build:
      context: ./services/http2
      dockerfile: Dockerfile.python
    container_name: http2-python-server
    hostname: http2-python
    ports:
      - "9443:9443"     # HTTP/2 TLS (hyper-h2)
      - "9080:9080"     # HTTP/2 cleartext
    volumes:
      - ./logs/http2:/var/log/http2:rw
      - ./services/http2/certs:/app/certs:rw
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - HTTP2_LOG_LEVEL=INFO
      - HTTP2_VALIDATE_HEADERS=true
      - HTTP2_LOG_HPACK=true
      - HTTP2_LOG_FRAMES=true
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 9080), timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.protocol: "http2"
      oida.group: "http2"
      oida.description: "HTTP/2 server (Python, hyper-h2), TLS + cleartext, HPACK + header validation"
      oida.ports: "9443, 9080"

  http2-h2spec:
    image: summerwind/h2spec:latest
    container_name: http2-h2spec
    hostname: h2spec
    profiles: ["http2-test"]
    networks:
      - ics-network
    entrypoint: ["sleep", "infinity"]
    labels:
      oida.protocol: "http2"
      oida.group: "http2"
      oida.description: "HTTP/2 spec conformance tester (h2spec), validates RFC 7540 compliance"
      oida.ports: ""

  # ============================================================================
  # ASTM/LIS Mock Servers
  # ============================================================================

  astm-mock:
    image: itechuw/astm-mock-server:latest
    container_name: astm-mock-server
    hostname: astm-server
    ports:
      - "1394:5000"     # ASTM E1394 (LIS2-A2)
    environment:
      - TZ=UTC
      - ANALYZER_TYPE=CHEMISTRY
      - RESPONSE_DELAY_MS=100
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 5000), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "astm"
      oida.description: "ASTM E1394 chemistry analyzer sim, LIS2-A2 framing, bidirectional"
      oida.ports: "1394"

  astm-hematology:
    image: itechuw/astm-mock-server:latest
    container_name: astm-hematology-server
    hostname: astm-hematology
    ports:
      - "1395:5000"     # ASTM on alternate port
    environment:
      - TZ=UTC
      - ANALYZER_TYPE=HEMATOLOGY
      - RESPONSE_DELAY_MS=100
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 5000), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "astm"
      oida.description: "ASTM LIS hematology analyzer sim, CBC/differential results, 100ms delay"
      oida.ports: "1395"

  astm-data:
    build:
      context: ./services
      dockerfile: Dockerfile.astm
    container_name: astm-data-server
    hostname: astm-data
    ports:
      - "1396:1394"     # ASTM with mock patient/order data
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - ASTM_PORT=1394
      - ASTM_ANALYZER=COBAS_8000
      - ASTM_ACCEPT_ALL=true
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 1394), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "astm"
      oida.description: "ASTM LIS data server (Cobas 8000 profile), accepts all connections, sample results"
      oida.ports: "1396"

  # ============================================================================
  # OCPP (Open Charge Point Protocol) Mock CSMS
  # ============================================================================

  ocpp-insecure:
    build:
      context: ./services
      dockerfile: Dockerfile.ocpp
    container_name: ocpp-insecure-csms
    hostname: ocpp-insecure
    ports:
      - "9000:9000"     # OCPP ws:// (insecure — no auth, accepts everything)
      - "9001:9001"     # OCPP ws:// (secure — HTTP Basic Auth, hardened)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; [socket.create_connection(('localhost', p), timeout=2).close() for p in [9000, 9001]]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      oida.protocol: "ocpp"
      oida.group: "ocpp"
      oida.description: "OCPP 1.6/2.0.1 CSMS, insecure ws://9000 + secure ws://9001 (CP001:SecureKey123)"
      oida.ports: "9000, 9001"

  # ============================================================================
  # CAN Bus Mock (UDP multicast — no kernel modules needed)
  # ============================================================================

  # ============================================================================
  # Layer 2 / Multicast Services (profiled - require host networking)
  # ============================================================================

  can-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.can
    container_name: can-mock-server
    hostname: can-mock
    network_mode: host
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - CAN_MULTICAST_PORT=43113
    restart: unless-stopped
    profiles: ["can"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'ping', ('239.0.0.1', 43113)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      oida.protocol: "can"
      oida.group: "can"
      oida.description: "CAN bus gateway sim, UDP multicast 239.0.0.1:43113, host networking"
      oida.ports: "43113/udp"

  ethercat-slave:
    build:
      context: ./services
      dockerfile: Dockerfile.ethercat
    container_name: ethercat-slave-device
    hostname: ethercat-slave
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - TZ=UTC
      - ETHERCAT_INTERFACE=eth0
      - ETHERCAT_POSITION=1
      - ETHERCAT_VERBOSITY=1
      - ETHERCAT_CREATE_VETH=0
    restart: unless-stopped
    profiles: ["ethercat"]
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.protocol: "ethercat"
      oida.group: "ethercat"
      oida.description: "EtherCAT slave device sim, raw L2 frames, host networking, requires root"
      oida.ports: "L2"

  # EtherCAT slave with self-contained veth pair for testing without hardware.
  # Creates ecat0/ecat1 pair inside the container; bridges ecat1 to eth0
  # so frames from the Docker bridge reach the slave.
  # Test with: oida ethercat br-ecat  (from host, targeting Docker bridge)
  ethercat-slave-veth:
    build:
      context: ./services
      dockerfile: Dockerfile.ethercat
    container_name: ethercat-slave-veth
    hostname: ethercat-veth
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - TZ=UTC
      - ETHERCAT_INTERFACE=eth0
      - ETHERCAT_POSITION=1
      - ETHERCAT_VERBOSITY=1
      - ETHERCAT_CREATE_VETH=1
    restart: unless-stopped
    profiles: ["ethercat"]
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.protocol: "ethercat"
      oida.group: "ethercat"
      oida.description: "EtherCAT slave with veth pair, bridge networking, self-contained testing"
      oida.ports: "L2"

  profinet-device:
    build:
      context: ./services
      dockerfile: Dockerfile.profinet
    container_name: profinet-pnet-device
    hostname: profinet-device
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - TZ=UTC
      - PNET_STATION_NAME=pnmock-device
      - PNET_INTERFACE=eth0
      - PNET_VERBOSITY=2
    restart: unless-stopped
    profiles: ["profinet"]
    labels:
      oida.protocol: "profinet"
      oida.group: "profinet"
      oida.description: "PROFINET IO device sim, DCP discovery, raw L2 frames, host networking"
      oida.ports: "L2"

  goose-l2-publisher:
    build:
      context: ./services
      dockerfile: Dockerfile.goose
    container_name: goose-l2-publisher
    hostname: goose-publisher
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - TZ=UTC
      - GOOSE_INTERFACE=${GOOSE_INTERFACE:-eth0}
      - GOOSE_APPID=0x1000
      - GOOSE_GOCB_REF=simpleIOGenericIO/LLN0$$GO$$gcb01
      - GOOSE_DATASET_REF=simpleIOGenericIO/LLN0$$dataset1
      - GOOSE_INTERVAL=1.0
      - GOOSE_STATE_INTERVAL=10.0
      - GOOSE_CONF_REV=1
    restart: unless-stopped
    profiles: ["goose-l2"]
    labels:
      oida.protocol: "goose"
      oida.group: "goose"
      oida.description: "IEC 61850 GOOSE L2 publisher, multicast frames, host networking, requires root"
      oida.ports: "L2"

  # ============================================================================
  # VNC / FTP / SMTP / HTTP Mock Services (state machine testing)
  # ============================================================================

  vnc-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.vnc
    container_name: vnc-mock-server
    hostname: vnc-mock
    ports:
      - "5900:5900"
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5900"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "vnc"
      oida.description: "VNC mock server (x11vnc, no auth) for state machine testing"
      oida.ports: "5900"

  ftp-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.ftp
    container_name: ftp-mock-server
    hostname: ftp-mock
    ports:
      - "2121:21"
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "nc 127.0.0.1 21 </dev/null 2>&1 | grep -q 220"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      oida.group: "ftp"
      oida.description: "FTP mock server (vsftpd, local auth) for state machine testing"
      oida.ports: "2121"

  smtp-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.smtp
    container_name: smtp-mock-server
    hostname: smtp-mock
    ports:
      - "2530:25"
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "25"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.group: "smtp"
      oida.description: "SMTP mock server (Postfix, AUTH LOGIN) for state machine testing"
      oida.ports: "2530"

  http-mock:
    image: nginx:1.27-alpine
    container_name: http-mock-server
    hostname: http-mock
    ports:
      - "8083:80"
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      oida.group: "http"
      oida.description: "HTTP mock server (nginx) for state machine testing"
      oida.ports: "8083"

  # ============================================================================
  # Medical Protocols — HL7 / DICOM / FHIR
  # ============================================================================

  hl7-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.hl7
    container_name: hl7-mock-server
    hostname: hl7-server
    ports:
      - "2575:2575"     # HL7 v2 MLLP
      - "2576:2576"     # HL7 v2 MLLPS (TLS)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - ENABLE_TLS=1
      - RESPONSE_MODE=normal
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 2575), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "hl7"
      oida.description: "HL7 v2 MLLP + MLLPS server, ADT/ORM/ORU messages, no auth"
      oida.ports: "2575, 2576"

  hl7-node-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.hl7-node
    container_name: hl7-node-mock-server
    hostname: hl7-node
    ports:
      - "2577:2576"     # HL7 v2 MLLP (Node.js stack)
    environment:
      - TZ=UTC
      - PORT=2576
      - RESPONSE_MODE=normal
      - SERVER_APP=NODE_HIS
      - SERVER_FACILITY=GENERAL_HOSPITAL
      - HL7_VERSION=2.5.1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').createConnection({port:2576,timeout:2000});s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "hl7"
      oida.description: "HL7 v2 MLLP server (Node.js)"
      oida.ports: "2577"

  dicom-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.dicom
    container_name: dicom-mock-server
    hostname: dicom-server
    ports:
      - "11112:11112"   # DICOM (pynetdicom)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - DICOM_AET=MOCK_PACS
      - DICOM_PORT=11112
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 11112), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.group: "dicom"
      oida.description: "DICOM SCP (AET: MOCK_PACS), accepts any calling AET, C-ECHO/C-STORE/C-FIND"
      oida.ports: "11112"

  dicom-strict:
    build:
      context: ./services
      dockerfile: Dockerfile.dicom
    container_name: dicom-strict-server
    hostname: dicom-strict
    ports:
      - "11113:11112"   # DICOM with strict AET whitelist
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - DICOM_AET=STRICT_PACS
      - DICOM_PORT=11112
      - DICOM_AET_WHITELIST=PACS,WORKSTATION,CT_SCANNER,MR_SCANNER
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 11112), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      oida.group: "dicom"
      oida.description: "DICOM SCP, AET whitelist enforced (AET: STRICT_PACS, allowed: PACS/WORKSTATION/CT_SCANNER/MR_SCANNER)"
      oida.ports: "11113"

  fhir-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.fhir
    container_name: fhir-mock-server
    hostname: fhir-server
    ports:
      - "8081:8080"     # FHIR R4 REST API
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/fhir/metadata', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      oida.group: "fhir"
      oida.description: "FHIR R4 REST API (no auth)"
      oida.ports: "8081"

  # ============================================================================
  # Orthanc PACS Server (Full-Featured DICOM)
  # ============================================================================

  dicom-orthanc:
    image: jodogne/orthanc-plugins:1.12.3
    container_name: dicom-orthanc
    hostname: orthanc
    ports:
      - "4242:4242"       # DICOM (standard port 104 equivalent)
      - "8042:8042"       # Web UI / REST API
    volumes:
      - ./services/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-data:/var/lib/orthanc/db
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8042/system"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      oida.group: "dicom"
      oida.description: "Orthanc PACS server (AET: ORTHANC_PACS, REST: 8042, no auth)"
      oida.ports: "4242, 8042"

  # ============================================================================
  # Mirth Connect (Full-Featured HL7 Engine)
  # ============================================================================

  hl7-mirth-db:
    image: postgres:15-alpine
    container_name: hl7-mirth-db
    hostname: mirth-db
    environment:
      - POSTGRES_USER=mirth
      - POSTGRES_PASSWORD=mirth
      - POSTGRES_DB=mirthdb
    volumes:
      - mirth-db-data:/var/lib/postgresql/data
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirth -d mirthdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      oida.group: "hl7"
      oida.description: "HL7 Mirth Connect PostgreSQL backend, db: mirthdb (mirth:mirth)"
      oida.ports: ""

  hl7-mirth:
    image: nextgenhealthcare/connect:4.5.0
    container_name: hl7-mirth
    hostname: mirth
    depends_on:
      hl7-mirth-db:
        condition: service_healthy
    ports:
      - "8443:8443"       # Mirth Administrator (HTTPS)
      - "8080:8080"       # HTTP API
      - "6661:6661"       # HL7 MLLP Channel 1 (ADT)
      - "6662:6662"       # HL7 MLLP Channel 2 (ORU)
      - "6663:6663"       # HL7 MLLP Channel 3 (ORM)
    environment:
      - TZ=UTC
      - DATABASE=postgres
      - DATABASE_URL=jdbc:postgresql://mirth-db:5432/mirthdb
      - DATABASE_USERNAME=mirth
      - DATABASE_PASSWORD=mirth
      - VMOPTIONS=-Xmx512m
    volumes:
      - ./services/mirth/channels:/opt/connect/channels:ro
      - mirth-appdata:/opt/connect/appdata
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null https://localhost:8443/api/system/stats || test $? -eq 22"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      oida.group: "hl7"
      oida.description: "Mirth Connect HL7 integration engine, web UI :8443, MLLP :6661-6663 (mirth:mirth)"
      oida.ports: "8443, 6661-6663"

networks:
  ics-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  logs:
  orthanc-data:
  mirth-db-data:
  mirth-appdata:
