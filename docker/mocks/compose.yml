    container_name: snmp-mock-server
    hostname: snmp-mock
    ports:
      - "10161:161/udp"    # SNMP UDP (net-snmp, v2c+v3, linux profile)
    environment:
      - TZ=UTC
      - SNMP_PROFILE=linux
    restart: unless-stopped
    cap_add:
      - NET_ADMIN          # for dummy interfaces, ARP entries
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "snmpget", "-v2c", "-c", "public", "-t", "2", "-r", "0", "localhost:161", ".1.3.6.1.2.1.1.1.0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s
    labels:
      oida.group: "snmp"
      oida.description: "SNMP v2c+v3 (communities: public/private/SCADA/monitor, v3: admin:admin123, engineer:engineer1, monitor:monitor1, operator:operator1)"
