    ports:
      - "2525:25"
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "25"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "oida.group=smtp"
