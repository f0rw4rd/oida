# CVE / Vulnerable Service Mock Services
# Stack with: just up cve (or docker compose -f compose.yml -f compose.cve.yml --profile vuln-services up -d)
# Per-protocol: just up-cve smtp (activates vuln-smtp profile)

services:

  # ============================================================================
  # SMTP
  # ============================================================================

  smtp-mock:
    build:
      context: ./services/smtp/mock
      dockerfile: Dockerfile.smtp
    image: ${OIDA_REGISTRY:-ghcr.io/f0rw4rd}/oida-mock-smtp-mock:latest
    container_name: smtp-mock-server
    hostname: smtp-mock
    profiles: ["vuln-services", "vuln-smtp", "fuzz-test"]
    ports:
      - "2520:25"
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost', 25)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "oida.group=smtp"
      - "oida.ports=2520"
      - "oida.protocol=smtp"
      - "oida.description=SMTP mock server for fuzz testing"

  # ============================================================================
  # DNS CVE (existing dnsmasq builds)
