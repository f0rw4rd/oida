[supervisord]
nodaemon=true
logfile=/var/log/msf-ics/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/msf-ics

[program:modbus]
command=python3 /app/services/modbus_server.py
directory=/app/services
autostart=true
autorestart=true
stdout_logfile=/var/log/msf-ics/modbus.log
stderr_logfile=/var/log/msf-ics/modbus_err.log
priority=10

[program:opcua]
command=python3 /app/services/opcua_server.py
directory=/app/services
autostart=true
autorestart=true
stdout_logfile=/var/log/msf-ics/opcua.log
stderr_logfile=/var/log/msf-ics/opcua_err.log
priority=20

[program:ads]
command=python3 /app/services/ads_server.py
directory=/app/services
autostart=true
autorestart=true
stdout_logfile=/var/log/msf-ics/ads.log
stderr_logfile=/var/log/msf-ics/ads_err.log
priority=30

[program:ethernetip]
command=python3 /app/services/ethernetip_server.py
directory=/app/services
autostart=true
autorestart=true
stdout_logfile=/var/log/msf-ics/ethernetip.log
stderr_logfile=/var/log/msf-ics/ethernetip_err.log
priority=40

[program:bacnet]
command=python3 /app/services/bacnet_server.py
directory=/app/services
autostart=true
autorestart=true
stdout_logfile=/var/log/msf-ics/bacnet.log
stderr_logfile=/var/log/msf-ics/bacnet_err.log
priority=50

# DNP3 is served by dedicated containers (dnp3-basic, dnp3-complex, etc.)
# and is no longer run inside the main supervisord container.

[program:hl7]
command=python3 /app/services/hl7_server.py
directory=/app/services
autostart=true
autorestart=true
stdout_logfile=/var/log/msf-ics/hl7.log
stderr_logfile=/var/log/msf-ics/hl7_err.log
priority=70

[program:dicom]
command=python3 /app/services/dicom_server.py
directory=/app/services
autostart=true
autorestart=true
stdout_logfile=/var/log/msf-ics/dicom.log
stderr_logfile=/var/log/msf-ics/dicom_err.log
priority=80
