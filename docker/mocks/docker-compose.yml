  # =============================================================================
  # HTTP/2 Fuzzing Testbed
  # =============================================================================
  # Two complementary servers for protocol fuzzing:
  # - http2-nghttp2: Industry-standard implementation with frame-level logging
  # - http2-python: hyper-h2 based server with validation callbacks

  http2-nghttp2:
    build:
      context: ./services/http2
      dockerfile: Dockerfile.nghttp2
    container_name: http2-nghttp2-server
    hostname: http2-nghttp2
    ports:
      - "8280:8443"     # HTTP/2 TLS (nghttpd) - remapped to avoid Mirth 8443 conflict
      - "8281:8080"     # HTTP/2 cleartext (h2c) - remapped to avoid Mirth 8080 conflict
    volumes:
      - ./services/http2/certs:/app/certs:ro
      - ./logs/http2:/var/log/http2:rw
    environment:
      - TZ=UTC
      - HTTP2_VERBOSE=true
      - HTTP2_HEXDUMP=false
      - HTTP2_LOG_FRAMES=true
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "--http2-prior-knowledge", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "oida.protocol=http2"
      - "oida.description=nghttp2 HTTP/2 server with frame-level logging"

  http2-python:
    build:
      context: ./services/http2
      dockerfile: Dockerfile.python
    container_name: http2-python-server
    hostname: http2-python
    ports:
      - "9443:9443"     # HTTP/2 TLS (hyper-h2)
      - "9080:9080"     # HTTP/2 cleartext
    volumes:
      - ./logs/http2:/var/log/http2:rw
      - ./services/http2/certs:/app/certs:rw
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - HTTP2_LOG_LEVEL=INFO
      - HTTP2_VALIDATE_HEADERS=true
      - HTTP2_LOG_HPACK=true
      - HTTP2_LOG_FRAMES=true
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 9080), timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "oida.protocol=http2"
      - "oida.description=Python HTTP/2 server with validation callbacks"

  # h2spec conformance testing tool (on-demand profile)
  http2-h2spec:
    image: summerwind/h2spec:latest
    container_name: http2-h2spec
    hostname: h2spec
    profiles: ["http2-test"]
    networks:
      - ics-network
    entrypoint: ["sleep", "infinity"]
    labels:
      - "oida.protocol=http2"
      - "oida.description=HTTP/2 conformance testing tool"

  # ============================================================================
  # EtherCAT Slave Emulation (software-based)
  # Emulates an EtherCAT slave device using raw sockets (EtherType 0x88A4).
  # Requires host networking or macvlan for Layer 2 (raw Ethernet) access.
  # ============================================================================

  ethercat-slave:
    build:
      context: ./services
      dockerfile: Dockerfile.ethercat
    container_name: ethercat-slave-device
    hostname: ethercat-slave
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - TZ=UTC
      - ETHERCAT_INTERFACE=eth0
      - ETHERCAT_POSITION=1
      - ETHERCAT_VERBOSITY=1
    restart: unless-stopped
    profiles: ["ethercat"]
    labels:
      - "oida.protocol=ethercat"
      - "oida.description=EtherCAT slave emulation with CoE/FoE mailbox support"

  # ============================================================================
  # PROFINET IO Device Emulation (p-net stack)
  # Emulates a PROFINET IO Device with DCP, LLDP, and IO communication.
  # Requires host networking or macvlan for Layer 2 (raw Ethernet) access.
  # ============================================================================

  profinet-device:
    build:
      context: ./services
      dockerfile: Dockerfile.profinet
    container_name: profinet-pnet-device
    hostname: profinet-device
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - TZ=UTC
      - PNET_STATION_NAME=oida-pn-device
      - PNET_INTERFACE=eth0
      - PNET_VERBOSITY=2
    restart: unless-stopped
    profiles: ["profinet"]
    labels:
      - "oida.protocol=profinet"
      - "oida.description=PROFINET IO Device emulation (p-net stack) with DCP/LLDP"

networks:
  ics-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  logs:
  orthanc-data:
  mirth-db-data:
  mirth-appdata:
  openelis-db-data:
  openelis-plugins:
