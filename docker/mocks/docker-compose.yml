services:
  msf-ics-mock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msf-ics-mock-services
    hostname: msf-ics-mock
    ports:
      # Network-based ICS protocols
      - "502:502"       # Modbus TCP
      - "4840:4840"     # OPC UA
      # - "2404:2404"   # IEC 60870-5-104 (moved to iec104-lib60870 service)
      - "48898:48898"   # Beckhoff ADS
      # - "102:102"     # MMS/IEC 61850 (moved to mms-libiec61850 service)
      - "44818:44818"   # EtherNet/IP
      - "47808:47808/udp"  # BACnet/IP (UDP)
    volumes:
      - ./logs:/var/log/msf-ics
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; [socket.create_connection(('localhost', port), timeout=2).close() for port in [502, 4840, 48898, 44818]]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mms-libiec61850:
    build:
      context: ./services
      dockerfile: Dockerfile.mms
    container_name: mms-libiec61850-server
    hostname: mms-server
    ports:
      - "102:102"       # MMS/IEC 61850 (libiec61850-based)
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/102"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  iec104-lib60870:
    build:
      context: ./services/iec104
      dockerfile: Dockerfile
    container_name: iec104-lib60870-server
    hostname: iec104-server
    ports:
      - "2404:2404"     # IEC 60870-5-104 (lib60870-based)
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/2404"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Python-based IEC104 server with custom Type ID support (for testing --probe-custom-types)
  iec104-custom-types:
    build:
      context: ./services
      dockerfile: iec104/Dockerfile.python
    container_name: iec104-custom-types-server
    hostname: iec104-custom
    ports:
      - "2405:2404"     # IEC 60870-5-104 with custom types (port 2405)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/2404"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Conpot IEC 104 Honeypot (Honeynet Project)
  # Low-interaction honeypot with ASDU address 7720 (non-standard)
  # Article reference: foxgrid.net IEC 104 guide
  iec104-conpot:
    image: honeynet/conpot:latest
    container_name: iec104-conpot-server
    hostname: iec104-conpot
    ports:
      - "2409:2404"
    environment:
      - TZ=UTC
    command: ["/home/conpot/.local/bin/conpot", "-f", "--template", "IEC104", "--logfile", "/var/log/conpot/conpot.log", "--temp_dir", "/tmp"]
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 2404), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "oida.protocol=iec104"
      - "oida.description=Conpot IEC 104 honeypot (ASDU address 7720)"

  snap7-server:
    build:
      context: ./services
      dockerfile: Dockerfile.snap7
    container_name: snap7-mock-server
    hostname: snap7-server
    ports:
      - "10102:102"     # Siemens S7 (mapped to 10102 to avoid MMS conflict)
    environment:
      - TZ=UTC
      - SNAP7_CPU_TYPE=1200
      - SNAP7_DB_COUNT=10
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "102"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  knx-calimero:
    image: calimeroproject/knxserver:latest
    container_name: knx-calimero-server
    hostname: knx-server
    stdin_open: true        # Keep stdin open for interactive server
    tty: true               # Allocate pseudo-TTY
    ports:
      - "3671:3671/udp"   # KNXnet/IP UDP (standard)
      - "3671:3671/tcp"   # KNXnet/IP TCP tunneling
    volumes:
      - ./services/knx/server-config.xml:/config/server-config.xml:ro
    environment:
      - TZ=UTC
    command: ["/config/server-config.xml"]
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "nc", "-z", "knx-server", "3671"]   # TCP check on hostname (binds to eth0, not localhost)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mqtt-mock:
    build:
      context: ./services/mqtt
      dockerfile: Dockerfile
    container_name: mqtt-mock-brokers
    hostname: mqtt-server
    ports:
      - "1883:1883"     # MQTT Insecure (anonymous, no TLS)
      - "1884:1884"     # MQTT Auth (weak credentials, brute-force target)
      - "1885:1885"     # MQTT Sparkplug B (ICS simulation)
      - "1886:1886"     # MQTT BUSY (auth required, NO wildcards, 50+ high-freq topics)
      - "8883:8883"     # MQTT TLS (optional client cert)
      - "8884:8884"     # MQTT Mutual TLS (client cert required)
      - "8885:8885"     # MQTT BUSY TLS (auth + no wildcards + high activity + TLS)
      - "8886:8886"     # MQTT BUSY Mutual TLS (client cert + auth + no wildcards)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/mqtt/certs:/app/certs:rw
      - ./services/mqtt/wordlists:/app/wordlists:ro
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; [socket.create_connection(('localhost', port), timeout=2).close() for port in [1883, 1884, 1885, 1886]]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================================
  # OPC UA Advanced Testing Services
  # ============================================================================

  opcua-advanced:
    build:
      context: ./services
      dockerfile: Dockerfile.opcua
    container_name: opcua-advanced-server
    hostname: opcua-advanced
    ports:
      - "4841:4840"     # OPC UA Enhanced (methods, subscriptions, events, multi-security)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - OPCUA_PORT=4840
      - OPCUA_SECURITY=true
      - OPCUA_AUTH=true
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 4840), timeout=2).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  opcua-gds:
    build:
      context: ./services
      dockerfile: Dockerfile.opcua-gds
    container_name: opcua-gds-server
    hostname: opcua-gds
    ports:
      - "4850:4850"     # OPC UA Global Discovery Server
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - GDS_PORT=4850
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 4850), timeout=2).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  opcua-insecure:
    build:
      context: ./services
      dockerfile: Dockerfile.opcua
    container_name: opcua-insecure-server
    hostname: opcua-insecure
    ports:
      - "4842:4840"     # OPC UA Insecure (no security, anonymous only)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - OPCUA_PORT=4840
      - OPCUA_SECURITY=false
      - OPCUA_AUTH=false
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 4840), timeout=2).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Medical Protocol Mock Services
  # ============================================================================

  hl7-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.hl7
    container_name: hl7-mock-server
    hostname: hl7-server
    ports:
      - "2575:2575"     # HL7 v2 MLLP
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 2575), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dicom-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.dicom
    container_name: dicom-mock-server
    hostname: dicom-server
    ports:
      - "11112:11112"   # DICOM (pynetdicom)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - DICOM_AET=MOCK_PACS
      - DICOM_PORT=11112
      # Set AET whitelist to test security (empty = accept all)
      # - DICOM_AET_WHITELIST=PACS,WORKSTATION,CT_SCANNER
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 11112), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  dicom-strict:
    build:
      context: ./services
      dockerfile: Dockerfile.dicom
    container_name: dicom-strict-server
    hostname: dicom-strict
    ports:
      - "11113:11112"   # DICOM with strict AET whitelist
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - DICOM_AET=STRICT_PACS
      - DICOM_PORT=11112
      - DICOM_AET_WHITELIST=PACS,WORKSTATION,CT_SCANNER,MR_SCANNER
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 11112), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  fhir-mock:
    build:
      context: ./services
      dockerfile: Dockerfile.fhir
    container_name: fhir-mock-server
    hostname: fhir-server
    ports:
      - "8081:8080"     # FHIR R4 REST API
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/fhir/metadata', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ASTM/LIS Mock Server (iTechUW - OpenELIS team)
  # Real ASTM LIS2-A2 implementation from University of Washington
  astm-mock:
    image: itechuw/astm-mock-server:latest
    container_name: astm-mock-server
    hostname: astm-server
    ports:
      - "1394:5000"     # ASTM E1394 (LIS2-A2) - server listens on 5000
    environment:
      - TZ=UTC
      - ANALYZER_TYPE=CHEMISTRY
      - RESPONSE_DELAY_MS=100
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 5000), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ASTM Mock with hematology analyzer type
  astm-hematology:
    image: itechuw/astm-mock-server:latest
    container_name: astm-hematology-server
    hostname: astm-hematology
    ports:
      - "1395:5000"     # ASTM on alternate port
    environment:
      - TZ=UTC
      - ANALYZER_TYPE=HEMATOLOGY
      - RESPONSE_DELAY_MS=100
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 5000), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Custom ASTM Mock Server (msf-ics)
  # For data enumeration testing - has patient/order/result mock data
  astm-data:
    build:
      context: ./services
      dockerfile: Dockerfile.astm
    container_name: astm-data-server
    hostname: astm-data
    ports:
      - "1396:1394"     # ASTM with mock patient/order data
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - ASTM_PORT=1394
      - ASTM_ANALYZER=COBAS_8000
      - ASTM_ACCEPT_ALL=true
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 1394), timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Production-Grade Medical Protocol Servers
  # ============================================================================

  # Orthanc - Full-featured DICOM/PACS server
  # https://www.orthanc-server.com/
  orthanc:
    image: jodogne/orthanc-plugins:1.12.3
    container_name: orthanc-pacs
    hostname: orthanc
    ports:
      - "4242:4242"       # DICOM (standard port 104 equivalent)
      - "8042:8042"       # Web UI / REST API
    volumes:
      - ./services/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-data:/var/lib/orthanc/db
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8042/system"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # OpenELIS Global - Full-featured Laboratory Information System
  # https://openelis-global.org/ (ASTM + HL7 analyzer integration)
  # Note: This is a heavyweight LIS - use astm-mock for basic testing
  openelis-db:
    image: postgres:14-alpine
    container_name: openelis-postgres
    hostname: openelis-db
    profiles: ["openelis"]  # Only start with: docker-compose --profile openelis up
    environment:
      - POSTGRES_USER=clinlims
      - POSTGRES_PASSWORD=clinlims
      - POSTGRES_DB=clinlims
    volumes:
      - openelis-db-data:/var/lib/postgresql/data
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinlims -d clinlims"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  openelis:
    image: itechuw/openelis-global-2:develop
    container_name: openelis-global
    hostname: openelis
    profiles: ["openelis"]
    depends_on:
      openelis-db:
        condition: service_healthy
    ports:
      - "8180:8080"       # OpenELIS Web UI
      - "8543:8443"       # OpenELIS HTTPS
    environment:
      - TZ=UTC
      - DEFAULT_PW=adminADMIN!
      - CATALINA_OPTS=-Xmx1g
    volumes:
      - openelis-plugins:/var/lib/openelis-global/plugins
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/OpenELIS-Global/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ASTM-HTTP Bridge for OpenELIS analyzer integration
  astm-bridge:
    image: itechuw/astm-http-bridge:latest
    container_name: astm-http-bridge
    hostname: astm-bridge
    profiles: ["openelis"]
    depends_on:
      openelis:
        condition: service_healthy
    ports:
      - "12001:12001"     # ASTM protocol (analyzer connects here)
    environment:
      - TZ=UTC
      - LOGGING_LEVEL_ORG_ITECH=INFO
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "12001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Mirth Connect - Full-featured HL7 integration engine
  # https://github.com/nextgenhealthcare/connect
  mirth-db:
    image: postgres:15-alpine
    container_name: mirth-postgres
    hostname: mirth-db
    environment:
      - POSTGRES_USER=mirth
      - POSTGRES_PASSWORD=mirth
      - POSTGRES_DB=mirthdb
    volumes:
      - mirth-db-data:/var/lib/postgresql/data
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirth -d mirthdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mirth-connect:
    image: nextgenhealthcare/connect:4.5.0
    container_name: mirth-connect
    hostname: mirth
    depends_on:
      mirth-db:
        condition: service_healthy
    ports:
      - "8443:8443"       # Mirth Administrator (HTTPS)
      - "8080:8080"       # HTTP API
      - "6661:6661"       # HL7 MLLP Channel 1 (ADT)
      - "6662:6662"       # HL7 MLLP Channel 2 (ORU)
      - "6663:6663"       # HL7 MLLP Channel 3 (ORM)
    environment:
      - TZ=UTC
      - DATABASE=postgres
      - DATABASE_URL=jdbc:postgresql://mirth-db:5432/mirthdb
      - DATABASE_USERNAME=mirth
      - DATABASE_PASSWORD=mirth
      - VMOPTIONS=-Xmx512m
    volumes:
      - ./services/mirth/channels:/opt/connect/channels:ro
      - mirth-appdata:/opt/connect/appdata
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null https://localhost:8443/api/system/stats || test $? -eq 22"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ============================================================================
  # DNP3 Mock Services (stepfunc dnp3 Rust crate - pure-Rust outstation)
  # All services use the same Dockerfile.dnp3 with different env var configs.
  # ============================================================================

  # Basic DNP3 outstation -- simple power grid simulation
  dnp3-basic:
    build:
      context: ./services
      dockerfile: Dockerfile.dnp3
    container_name: dnp3-basic-server
    hostname: dnp3-basic
    ports:
      - "20000:20000"   # DNP3 TCP (basic)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - DNP3_PORT=20000
      - DNP3_OUTSTATION_ADDR=1024
      - DNP3_MASTER_ADDR=1
      - DNP3_BI_COUNT=10
      - DNP3_AI_COUNT=10
      - DNP3_CT_COUNT=5
      - DNP3_BO_COUNT=5
      - DNP3_AO_COUNT=5
      - DNP3_UPDATE_INTERVAL=5
      - DNP3_DEVICE_NAME=OIDA Basic Outstation
      - DNP3_SERIAL=OIDA-DNP3-BASIC-001
      - DNP3_SOFTWARE_VERSION=2.1.0
      - DNP3_HARDWARE_VERSION=Rev-A
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 20000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Complex outstation -- large substation with many data points
  dnp3-complex:
    build:
      context: ./services
      dockerfile: Dockerfile.dnp3
    container_name: dnp3-complex-server
    hostname: dnp3-complex
    ports:
      - "20001:20000"   # DNP3 TCP (complex)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - DNP3_PORT=20000
      - DNP3_OUTSTATION_ADDR=10
      - DNP3_MASTER_ADDR=1
      - DNP3_BI_COUNT=50
      - DNP3_AI_COUNT=50
      - DNP3_CT_COUNT=20
      - DNP3_BO_COUNT=20
      - DNP3_AO_COUNT=20
      - DNP3_UPDATE_INTERVAL=3
      - DNP3_DEVICE_NAME=OIDA Substation RTU
      - DNP3_SERIAL=OIDA-DNP3-SUB-010
      - DNP3_SOFTWARE_VERSION=3.4.1
      - DNP3_HARDWARE_VERSION=Rev-C
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 20000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # TLS outstation -- uses pydnp3-stepfunc TlsServerConfig for real DNP3-SA TLS.
  # Self-signed certs are generated at startup and written to /app/certs
  # (mounted as ./services/dnp3-certs for scanner access).
  # Uses non-standard address 1024 for testing address scanning.
  dnp3-tls:
    build:
      context: ./services
      dockerfile: Dockerfile.dnp3
    container_name: dnp3-tls-server
    hostname: dnp3-tls
    ports:
      - "20002:20000"   # DNP3 TLS
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - DNP3_PORT=20000
      - DNP3_OUTSTATION_ADDR=1024
      - DNP3_MASTER_ADDR=1
      - DNP3_BI_COUNT=10
      - DNP3_AI_COUNT=10
      - DNP3_CT_COUNT=5
      - DNP3_BO_COUNT=5
      - DNP3_AO_COUNT=5
      - DNP3_UPDATE_INTERVAL=5
      - DNP3_DEVICE_NAME=OIDA Secure Outstation
      - DNP3_SERIAL=OIDA-DNP3-TLS-1024
      - DNP3_TLS=true
      - DNP3_TLS_DNS_NAME=dnp3-tls
      - DNP3_SOFTWARE_VERSION=2.1.0
      - DNP3_HARDWARE_VERSION=Rev-A
    volumes:
      - ./services/dnp3-certs:/app/certs
    restart: unless-stopped
    networks:
      - ics-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 20000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Multi-address outstations -- three separate containers with different
  # DNP3 outstation addresses on consecutive ports.
  # Note: pydnp3-stepfunc routes connections by source IP (address_filter),
  # not by DNP3 link-layer address, so multiple outstations on one TCP
  # endpoint is not supported. Use consecutive ports instead.
  dnp3-addr1:
    build:
      context: ./services
      dockerfile: Dockerfile.dnp3
    container_name: dnp3-addr1-server
    hostname: dnp3-addr1
    ports:
      - "20003:20000"   # DNP3 TCP (outstation addr 2)
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - DNP3_PORT=20000
      - DNP3_OUTSTATION_ADDR=2
      - DNP3_MASTER_ADDR=1
